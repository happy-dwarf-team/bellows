name: Performance report
description: The start is not faster, or slower, with Bellows; or measurements from your setup.
labels: [performance]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way is the **Benchmark** tab of the Anvil Manager (Anvil 1.5 or newer): it runs the starts for you and gives a report to paste below. Without it, compare several starts with and without the plugin, alternating them, and say whether they are warm (game started before since the last reboot) or cold (first start after a reboot).
  - type: textarea
    id: benchmark-report
    attributes:
      label: Benchmark report (JSON)
      description: From the Benchmark tab's **Copy**, or a kept report opened from the tab. If you paste it, the fields below are optional.
      render: json
    validations:
      required: false
  - type: textarea
    id: times
    attributes:
      label: Start times
      description: Seconds to the main menu, each start, with and without the plugin.
      placeholder: |
        Without plugin: 35.1 / 34.8 / 35.4 s
        With plugin:    15.6 / 15.2 / 15.5 s
    validations:
      required: false
  - type: dropdown
    id: start-kind
    attributes:
      label: Warm or cold starts
      options:
        - Warm
        - Cold (after a reboot)
        - Mixed / not sure
    validations:
      required: false
  - type: input
    id: measured-how
    attributes:
      label: How you measured
      description: e.g. stopwatch from clicking Play, or timestamps in `anvil/anvil.log` / the game logs.
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Plugin, Anvil and game versions
    validations:
      required: false
  - type: textarea
    id: system
    attributes:
      label: System
      description: Drive the game is on (NVMe / SATA SSD / HDD), RAM, CPU, and the number of enabled mods.
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: anvil/anvil.log
      description: From a start with the plugin; it contains the module counters. Check it for anything you do not want to share.
      render: text
