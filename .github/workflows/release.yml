name: release

# release-please keeps a "chore: release x.y.z" pull request up to date from the
# Conventional Commits on main (version.txt, plugin/plugin.toml, CHANGELOG.md).
# Merging it tags vX.Y.Z and creates the GitHub release; the jobs below then
# build that commit and attach the plugin package.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token the release PR does not trigger CI (GitHub does not
      # start workflows from GITHUB_TOKEN events). A RELEASE_PLEASE_TOKEN secret
      # (fine-grained token or GitHub App token) makes the checks run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eu4-startup-boost-${{ github.sha }}
          path: dist

      - name: Prepare release assets
        working-directory: dist
        run: |
          mv "eu4-startup-boost-${GITHUB_SHA}.zip" eu4-startup-boost-windows-x64.zip
          sha256sum eu4-startup-boost-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed build provenance: `gh attestation verify eu4-startup-boost-windows-x64.zip -R happy-dwarf-team/eu4-startup-boost`.
      # GitHub offers attestations to public repositories on every plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/eu4-startup-boost-windows-x64.zip

      - name: Upload release assets
        working-directory: dist
        run: gh release upload "$TAG" eu4-startup-boost-windows-x64.zip SHA256SUMS.txt --clobber
