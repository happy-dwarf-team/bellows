name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component plugin --prefix dist/package
          $files = Get-ChildItem dist/package -Recurse -File
          $files | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath('dist/package', $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content dist/package/SHA256SUMS.txt
          Compress-Archive -Path dist/package/* -DestinationPath dist/eu4-startup-boost-${{ github.sha }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: eu4-startup-boost-${{ github.sha }}
          path: dist/eu4-startup-boost-${{ github.sha }}.zip
