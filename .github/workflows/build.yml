name: build

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml to build the package of a new release.
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build; empty builds the commit that started the run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Ninja with sccache in front of cl: a run compiles only the sources whose
      # inputs changed since the cached run. The MSVC environment (cl, link, rc on
      # PATH, INCLUDE, LIB) comes from vcvars64.bat, as a Developer prompt has it.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" |
            Where-Object { $_ -match '^[^=]+=' } | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: sccache
        shell: pwsh
        env:
          SCCACHE_VERSION: v0.19.0
          SCCACHE_SHA256: 28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1
        run: |
          $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SCCACHE_SHA256) { throw "$name.zip: SHA-256 mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $name | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP sccache)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # A release build (release.yml passes a ref) neither reads nor writes the
      # cache: its package is compiled from the sources alone.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ inputs.ref == '' }}
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Configure
        run: >-
          cmake -S . -B build -G "Ninja Multi-Config"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: |
          cmake --build build --config Release
          sccache --show-stats

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # plugin.toml, symbols.toml and settings.toml against Anvil's schemas, and
      # plugin/symbols.lock against symbols.toml (the lock comes from
      # `anvil check plugin --exe` on the real eu4.exe), as annotations.
      - name: anvil check
        shell: pwsh
        run: |
          $anvil = (Get-Content build/anvil-tool-Release.txt -Raw).Trim()
          & $anvil --version
          & $anvil check plugin --format github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component plugin --prefix dist/package
          $files = Get-ChildItem dist/package -Recurse -File
          $files | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath('dist/package', $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content dist/package/SHA256SUMS.txt
          Compress-Archive -Path dist/package/* -DestinationPath dist/bellows-${{ github.sha }}.zip

      # Per-commit artifact; for a release, release.yml attaches it to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bellows-${{ github.sha }}
          path: dist/bellows-${{ github.sha }}.zip

      # The Steam Workshop mod of workshop.toml is workshop/ with the plugin
      # folder of the package in anvil/bellows/, which is not in Git. A dry run of
      # paradox-workshop-publish writes to the job summary what a release would
      # publish (files, descriptor, the rendered description) and fails when the
      # mod would change the EU4 checksum (checksum = "keep"). It needs no
      # secrets and sends nothing to Steam.
      - name: Stage the Workshop mod
        shell: pwsh
        run: |
          Remove-Item workshop/anvil -Recurse -Force -ErrorAction Ignore
          New-Item -ItemType Directory workshop/anvil -Force | Out-Null
          Copy-Item dist/package/bellows workshop/anvil/bellows -Recurse

      # Pinned to a release tag, not a commit: the action installs the pdx-ws
      # release named by its own tag and verifies that release's attestation.
      - name: Workshop preview
        uses: happy-dwarf-team/paradox-workshop-publish@7366a4306b3c81157837bcdce7f138bc86e5d50b # v1.0.0
        with:
          pdx-ws-version: v1.0.0
          dry-run: true
