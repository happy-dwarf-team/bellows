name: website

# Rebuilds anvil.happydwarf.dev so the plugin page shows the new version. The
# website reads the latest published release, so this runs when the draft that
# release.yml creates is published, not when the draft is created. Needs a
# WEBSITE_DISPATCH_TOKEN secret allowed to dispatch to happy-dwarf-team/anvil-website.
on:
  release:
    types: [published]

permissions: {}

jobs:
  notify-website:
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Trigger website rebuild
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api repos/happy-dwarf-team/anvil-website/dispatches \
            -f event_type=plugin-release \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${TAG}"

      - name: Skip website rebuild (no WEBSITE_DISPATCH_TOKEN)
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::WEBSITE_DISPATCH_TOKEN is not set; website rebuild not triggered"
