name: codeql

# CodeQL code scanning in advanced setup. The C++ is built for real on
# Windows, as in build.yml, so CodeQL sees the code as MSVC compiles it (the
# default setup analyses it without a build on Linux, where the Windows
# headers are missing). The workflows are analysed without a build.
# Results go to Security -> Code scanning. Pushes and pull requests that
# change only documentation, release files or the Workshop page skip it; the
# weekly run still analyses main.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - version.txt
      - .release-please-manifest.json
      - workshop/**
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - version.txt
      - .release-please-manifest.json
      - workshop/**
  schedule:
    - cron: "17 4 * * 1"

# A new push to a pull request cancels its older runs of this workflow. Other
# runs (main, the weekly scan, a release's build) get a group of their own and
# are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c-cpp:
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The FetchContent sources and sub-builds, keyed on the CMake files that pin
      # them (a key of its own: build.yml configures them with Ninja).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-vs-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      # Only the plugin, in parallel: CodeQL did not extract the unit tests anyway.
      # Configure and the third-party libraries run before init, so CodeQL neither
      # traces nor analyses them (their results were dropped from the upload anyway).
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSB_BUILD_TESTS=OFF

      - name: Third-party libraries
        run: cmake --build build --config Release --target mimalloc-static sb_zlib --parallel

      # tools: linked is the CodeQL bundle of this action version, which the runner
      # image has in its toolcache; left out, the action takes a newer bundle when
      # GitHub offers one and spends over a minute unpacking it.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          tools: linked

      - name: Build
        run: cmake --build build --config Release --target bellows --parallel

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
          upload: never
          output: sarif-results

      # build/_deps holds the third-party sources CMake fetches and compiles;
      # their alerts belong upstream, so they are left out of the upload.
      - name: Drop results in fetched dependencies
        shell: python
        run: |
          import json
          path = "sarif-results/cpp.sarif"
          with open(path, encoding="utf-8") as f:
              sarif = json.load(f)
          def uri(result):
              locations = result.get("locations") or [{}]
              return locations[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
          for run in sarif["runs"]:
              kept = [r for r in run.get("results", []) if not uri(r).startswith("build/")]
              print(f"kept {len(kept)} of {len(run.get('results', []))} results")
              run["results"] = kept
          with open(path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results/cpp.sarif
          category: /language:c-cpp

  no-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
