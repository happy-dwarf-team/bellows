name: codeql

# CodeQL code scanning in advanced setup. The C++ is built for real on
# Windows, as in build.yml, so CodeQL sees the code as MSVC compiles it (the
# default setup analyses it without a build on Linux, where the Windows
# headers are missing). The workflows are analysed without a build.
# Results go to Security -> Code scanning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  c-cpp:
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:c-cpp
          upload: never
          output: sarif-results

      # build/_deps holds the third-party sources CMake fetches and compiles;
      # their alerts belong upstream, so they are left out of the upload.
      - name: Drop results in fetched dependencies
        shell: python
        run: |
          import json
          path = "sarif-results/cpp.sarif"
          with open(path, encoding="utf-8") as f:
              sarif = json.load(f)
          def uri(result):
              locations = result.get("locations") or [{}]
              return locations[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
          for run in sarif["runs"]:
              kept = [r for r in run.get("results", []) if not uri(r).startswith("build/")]
              print(f"kept {len(kept)} of {len(run.get('results', []))} results")
              run["results"] = kept
          with open(path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif-results/cpp.sarif
          category: /language:c-cpp

  no-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
