id = "bellows"
name = "Bellows"
version = "1.8.0"
authors = ["Happy Dwarf Team"]
description = "Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules."
api = 2
anvil = ">=1.23.0"   # module groups, settings of modules, [retired.*] (ADR 0013): an older Anvil refuses them
entry = "bellows.dll"
# Early: mimalloc must replace the heap imports before the game's C runtime
# allocates, and the warm-up threads must run ahead of the game.
phase = "early"
symbols = "symbols.toml"   # the game build comes from here
settings = "settings.toml"
# The modules give the game's own answers faster; none changes the simulation.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/bellows/issues"
repository = "https://github.com/happy-dwarf-team/bellows"

# Readiness (the main menu is up): the modules stop and save their profiles.
[[dependencies]]
id = "anvil-game"
version = "^1"

# Modules (Anvil ADR 0011, 0013): each feature is one module, and its switch in Anvil Manager or the
# overlay (enabled_modules / disabled_modules in anvil.toml) is the only one; settings.toml only refines
# a module (`module`). `group` orders them. None changes the simulation. Diagnostics holds the lab
# tools (profiles, the checks that were the "verify" mode of 1.x): with it off, no lab code runs.
# tests/test_module_switch.cpp checks this list against settings.toml and src/plugin.cpp.

[[modules]]
id = "mimalloc"
name = "Faster memory allocator"
description = "A faster allocator (mimalloc) for the game, until the main menu or for the whole session."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "open_warmup"
name = "File warm-up"
description = "Opens the files the game needs ahead of it. Helps most on the first start after a reboot."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "ram_prefetch"
name = "RAM prefetch"
description = "Unpacks the DLC archives the game needs into RAM in the background."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "verifypath_listing"
name = "Path check cache"
description = "Answers the game's file path checks from folder listings."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "listing_lookup"
name = "Lookups from listings"
description = "Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache."
group = "Start-up"
affects_gameplay = false
default = false

[[modules]]
id = "exists_index"
name = "File existence index"
description = "Answers the modifier icons' \"does this file exist\" check faster."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "trigger_intern"
name = "Trigger profile lookup"
description = "Faster trigger lookups at the end of loading."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "metascript_subst"
name = "Parameter substitution"
description = "Fills $parameters$ in scripted effects and triggers in one pass."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "metascript_blocks"
name = "Conditional blocks"
description = "Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "attr_cache"
name = "Missing-file cache"
description = "Remembers missing files during start-up. A small gain, about 0.1 s."
group = "Start-up"
affects_gameplay = false
default = false

[[modules]]
id = "token_dict_cache"
name = "Keyword cache"
description = "Caches the script reader's keyword lookups."
group = "Start-up"
affects_gameplay = false

[[modules]]
id = "history_add"
name = "Dated lists while loading"
description = "Adds dated history entries without rescanning the list. Same list."
group = "Loading"
affects_gameplay = false

[[modules]]
id = "checksum_defer"
name = "Checksum after the databases"
description = "Starts the game's checksum after the databases load; about 1 s off a big mod set's start."
group = "Loading"
affects_gameplay = false
default = false

[[modules]]
id = "verifypath_session"
name = "Path checks after start-up"
description = "Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache."
group = "Loading"
affects_gameplay = false

[[modules]]
id = "range_witness"
name = "Country range check"
description = "Answers the country range check from the last province in range. Same answers."
group = "Simulation"
affects_gameplay = false

[[modules]]
id = "frame_pacing"
name = "Frame pacing at speed 5"
description = "Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner."
group = "Simulation"
affects_gameplay = false

[[modules]]
id = "pops_pacing"
name = "Online service pacing"
description = "Runs the Paradox online-service checks less often at speed 5. Not in multiplayer."
group = "Simulation"
affects_gameplay = false

[[modules]]
id = "never_throttle"
name = "Full speed while minimized"
description = "Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU."
group = "Simulation"
affects_gameplay = false
default = false

[[modules]]
id = "modifier_merge"
name = "Modifier merge index"
description = "Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner."
group = "Simulation"
affects_gameplay = false

[[modules]]
id = "port_table"
name = "Port table"
description = "Builds each country's nearest-port table from its list of ports. Same table."
group = "Simulation"
affects_gameplay = false

[[modules]]
id = "province_modifier_view"
name = "Province modifier view"
description = "Reads province modifiers in place instead of copying them. Same values."
group = "Simulation"
affects_gameplay = false

[[modules]]
id = "army_search_memo"
name = "AI army search memo"
description = "Remembers each army's facts in the AI's daily army search. Same answers."
group = "Simulation"
affects_gameplay = false

[[modules]]
id = "save_compress"
name = "Save compression"
description = "Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads."
group = "Saving"
affects_gameplay = false

[[modules]]
id = "transfer_skip"
name = "Skip transfer compression"
description = "In single player, skips compressing a save for a multiplayer transfer nobody receives."
group = "Saving"
affects_gameplay = false

[[modules]]
id = "diagnostics"
name = "Diagnostics"
description = "Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows."
group = "For testing"
affects_gameplay = false
default = false
