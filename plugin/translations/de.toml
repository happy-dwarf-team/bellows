# The plugin's texts in German: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Schnellerer Start, schnellere Simulation und schnelleres Speichern in Europa Universalis IV, ohne Änderung an Spieldateien oder Regeln."
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "Schnellerer Speicherallokator für die C-Laufzeit des Spiels: für die ganze Spielsitzung oder nur bis zum Hauptmenü (spätere Allokationen nutzen den Windows-Heap)."
"Start-up" = "Start"
"On" = "An"
"Start-up only" = "Nur beim Start"
"Off" = "Aus"
"PhysFS path checks" = "PhysFS-Pfadprüfungen"
"Answers PhysFS path checks from directory listings." = "Beantwortet PhysFS-Pfadprüfungen aus Verzeichnislisten."
"Verify" = "Prüfen"
"File existence index" = "Index vorhandener Dateien"
"Answers \"does this file exist\" for the modifier icon check." = "Beantwortet „gibt es diese Datei?“ für die Prüfung der Modifikatorsymbole."
"Trigger profile lookup" = "Suche im Trigger-Profil"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "Schnelleres Nachschlagen jedes Triggers im Trigger-Profil des Spiels am Ende des Ladens."
"Parameter substitution" = "Parameterersetzung"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "$parameter$-Ersetzung in einem Durchgang in geskripteten Effekten und Triggern."
"Conditional blocks" = "Bedingte Blöcke"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "Auflösung von [[parameter] ...]-Blöcken in einem Durchgang in geskripteten Effekten und Triggern (großer Gewinn bei Mods mit großen geskripteten Effekten, z. B. Anbennar)."
"Open warm-up" = "Vorab-Öffnen"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "Öffnet die Dateien, die das Spiel brauchen wird, vorab auf parallelen Threads (gedacht für den ersten Start nach einem Neustart des Rechners)."
"RAM prefetch" = "RAM-Vorabladen"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "Liest und entpackt die Dateien der DLC-Archive, die das Spiel brauchen wird, auf Worker-Threads in den RAM."
"RAM prefetch budget (MB)" = "Budget für RAM-Vorabladen (MB)"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "RAM für entpackte Archivdateien, die das Spiel noch nicht abgeholt hat. Ein Start nutzt höchstens ein Viertel des in dem Moment freien Speichers."
"Missing-file cache" = "Cache fehlender Dateien"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "Merkt sich beim Start die Antworten „Datei nicht gefunden“ für Spiel- und Mod-Dateien (höchstens ~0,1 s zusätzlich zu den anderen Modulen)."
"Tokenizer keyword cache" = "Schlüsselwort-Cache des Tokenizers"
"Caches the script tokenizer's keyword lookups." = "Speichert die Schlüsselwortsuchen des Skript-Tokenizers zwischen."
"PhysFS path checks after start-up" = "PhysFS-Pfadprüfungen nach dem Start"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "Laden: beantwortet PhysFS-Pfadprüfungen auch nach dem Erscheinen des Hauptmenüs aus Verzeichnislisten (genutzt, solange verifypath_listing an ist), sodass das Laden eines Spielstands seine Texturen etwa 1,8 s früher findet. Eine Liste wird neu gelesen, wenn sie 30 s alt ist."
"Loading" = "Laden"
"Dated lists while loading" = "Datierte Listen beim Laden"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "Laden: fügt einen Eintrag, den das Spiel gerade gelesen hat, einer datierten Liste hinzu, ohne vorher die ganze Liste daraufhin zu durchlaufen, ob dieser neue Eintrag schon darin ist. Die Liste kommt gleich heraus. Prüfen lässt das Spiel die Liste durchlaufen und vergleicht."
"PhysFS lookups from listings" = "PhysFS-Suchen aus Verzeichnislisten"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "Start: beantwortet den zweiten Blick des Dateisystems in einen Ordner (gibt es die Datei, eine nicht vorhandene Datei öffnen) aus den Verzeichnislisten der PhysFS-Pfadprüfungen (genutzt, solange verifypath_listing an ist). Vorhandene Dateien öffnet weiterhin das Spiel. Spart die fehlgeschlagenen Öffnungen, die ein großes Mod-Set wie Anbennar in jedem überschriebenen Ordner macht. Prüfen fragt jedes Mal das Spiel und zählt Abweichungen."
"Checksum after the databases" = "Prüfsumme nach den Datenbanken"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "Laden: Die Prüfsummen-Aufgabe des Spiels beginnt erst mit dem Lesen von Dateien, wenn die Datenbanken geladen sind, und konkurriert so nicht mehr mit ihnen um die Sperre des Dateisystems. Dieselben Dateien, dieselbe Reihenfolge und dieselbe Prüfsumme im Menü; etwa 1 s weniger beim Start eines großen Mod-Sets wie Anbennar, nichts Messbares im Grundspiel. Prüfen protokolliert nur die Zeiten der Aufgabe."
"Country range check" = "Reichweitenprüfung der Länder"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "Simulation, nicht der Start: beantwortet die Reichweitenprüfung der Länder von der Provinz aus, die beim letzten Mal in Reichweite war; dieselben Antworten wie der Code des Spiels."
"Simulation" = "Simulation"
"Modifier merge index" = "Index für das Zusammenführen von Modifikatoren"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "Simulation: führt große Modifikatorlisten (die jedes Landes mit denen jeder Einheit in der monatlichen Aktualisierung) mit einem Index statt eines Durchlaufs pro Eintrag zusammen, sodass ein Jahr auf Geschwindigkeit 5 etwa 5 % schneller vergeht; dieselben Einträge, dieselbe Reihenfolge, dieselben Werte. Prüfen führt das Zusammenführen des Spiels aus und vergleicht."
"Online service pacing" = "Takt der Online-Dienste"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "Simulation: führt auf der höchsten Geschwindigkeit die Rückrufe der Paradox-Onlinedienste des Spiels alle 500 ms statt zweimal pro Frame aus. Gibt es nichts zuzustellen, lässt jeder Lauf den Hauptthread 1 ms schlafen. Der Mehrspielermodus behält den Takt des Spiels. Prüfen führt sie wie das Spiel aus und zählt, was ausgelassen würde."
"Province modifier view" = "Direktansicht der Provinzmodifikatoren"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "Simulation: liest einen Wert aus den Modifikatoren einer Provinz direkt, statt zuerst die ganze Liste zu kopieren (in der täglichen Länderaktualisierung und der KI); derselbe Wert. Prüfen führt die Kopie des Spiels aus und vergleicht."
"Port table" = "Hafentabelle"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "Simulation: baut die Tabelle des nächsten Hafens eines Landes aus einer Liste seiner Häfen neu auf, statt seine Provinzen und Beziehungen für jede Provinz der Karte erneut zu durchlaufen; dieselbe Tabelle. Prüfen führt die Funktion des Spiels aus und vergleicht."
"AI army search memo" = "Merkzettel der KI-Armeesuche"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "Simulation: ermittelt in der täglichen KI-Suche für jede Armee, in einer Wegsuche und beim Auflisten der Züge einer Einheit aus einer Provinz einmal, ob die Armee die Kontrollzonen von Festungen ignoriert und wie ihr Geschwindigkeitsmodifikator ist, statt bei jedem Zug; dieselben Antworten. Prüfen führt die Prüfung des Spiels jedes Mal aus und vergleicht."
"Frame pacing at speed 5" = "Frame-Pacing auf Geschwindigkeit 5"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "Simulation: zeichnet auf der höchsten Geschwindigkeit Frames aus dem täglichen Tick seltener, solange Sie nichts tun (siehe Intervall), sodass ein Jahr etwa 10 % schneller vergeht; ein Tastendruck oder Klick bekommt weiterhin sofort einen Frame. Die Simulation ist dieselbe; die Karte aktualisiert sich auf Geschwindigkeit 5 etwa 16- statt 22-mal pro Sekunde."
"Frame pacing interval (ms)" = "Frame-Pacing-Intervall (ms)"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "Kürzeste Zeit zwischen Frames, die auf der höchsten Geschwindigkeit im täglichen Tick gezeichnet werden (die des Spiels sind 50 ms; ein kürzerer Wert behält die des Spiels). 0 behält das Intervall des Spiels und zählt nur Frames. Gilt sofort, solange Frame-Pacing an ist."
"Frame pacing while you play" = "Frame-Pacing, während Sie spielen"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "Was Frame-Pacing tut, wenn Sie auf Geschwindigkeit 5 eine Taste drücken, klicken oder das Mausrad drehen: sofort einen Frame zeichnen, sodass das Spiel mindestens so schnell reagiert wie ohne Frame-Pacing (Frames werden nur übersprungen, solange Sie nichts tun), oder auf das längere Intervall warten (0.12.0). Gilt sofort, solange Frame-Pacing an ist."
"React at once" = "Sofort reagieren"
"Wait for the interval" = "Auf das Intervall warten"
"Full speed while minimized" = "Volle Geschwindigkeit bei minimiertem Fenster"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "Simulation: Solange ein Einzelspielerspiel auf Geschwindigkeit 5 läuft, überspringt das Spiel seine eigenen Wartezeiten von bis zu 100 ms pro Frame, die es bei minimiertem Fenster einlegt. Ein minimiertes Jahr dauert dann etwa 40–60 % weniger; bei sichtbarem Fenster ändert sich nichts. Braucht bei minimiertem Fenster auf Geschwindigkeit 5 mehr Prozessorzeit pro Sekunde. Pausen, Menüs, andere Geschwindigkeiten und der Mehrspielermodus behalten die Wartezeiten des Spiels."
"Save compression" = "Spielstand-Komprimierung"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "Speichern: komprimierte Spielstände (compress_autosave und Ähnliches) ohne die byteweise CRC-32 des Spiels; die Datei ist Byte für Byte die des Spiels. Prüfen führt zusätzlich die Komprimierung des Spiels aus, schreibt deren Ergebnis und vergleicht beide."
"Saving" = "Speichern"
"Parallel save compression" = "Parallele Spielstand-Komprimierung"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "Speichern, bei eingeschalteter Spielstand-Komprimierung: komprimiert große Teile eines komprimierten Spielstands (den gamestate) auf mehreren Threads. Der Spielstand ist ein gültiges Archiv, das das Spiel und andere Werkzeuge wie bisher lesen, aber seine komprimierten Bytes unterscheiden sich von denen des Spiels. Prüfen dekodiert jeden Teil vor dem Schreiben erneut."
"Skip transfer compression" = "Transfer-Komprimierung überspringen"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "Laden im Einzelspielermodus: komprimiert einen Text-Spielstand nicht für eine Mehrspieler-Übertragung, die niemand empfängt; das Spiel lädt dieselbe Datei wie bisher. Ein gehostetes Mehrspielerspiel bleibt, wie es ist. Prüfen behält die Kopie des Spiels und prüft, dass nichts sie liest."
"Daily tick profile" = "Profil des täglichen Ticks"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "Diagnose: Dauer jeder Stufe des täglichen, monatlichen und jährlichen Ticks und der darin gezeichneten Frames, pro Spieltag, in tick_profile*.tsv."
"Diagnostics" = "Diagnose"
"AI army search profile" = "Profil der KI-Armeesuche"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Diagnose: Aufrufe, Zeit und wiederholte Antworten der KI-Armeesuche, in army_search*.tsv."
"AI scoring probe" = "Messsonde der KI-Bewertung"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "Diagnose: wie oft sich die Eingaben der Bewertungsfunktionen der KI-Armeesuche innerhalb eines Spieltags wiederholen, in score_probe.tsv."
"Monthly tick probe" = "Messsonde des monatlichen Ticks"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "Diagnose: Dauer der Länder-, Provinz- und Einheitenaktualisierungen des monatlichen Ticks, der Modifikator-Zusammenführungen und der Zufallsziehungen, in monthly_probe*.tsv."
"ZIP read profile" = "Profil der ZIP-Lesezugriffe"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "Diagnose: in ZIP-Lesezugriffen und Inflate verbrachte Zeit pro Thread, in anvil.log."
"Tokenizer lookup profile" = "Profil der Tokenizer-Suchen"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "Diagnose: die Schlüsselwortsuchen des Tokenizers. Teilt seine Aufrufstelle mit dem Schlüsselwort-Cache des Tokenizers; schalten Sie diesen für saubere Zählungen aus."
"Range check profile" = "Profil der Reichweitenprüfung"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "Diagnose: Zähler der Reichweitenprüfung der Länder in range_profile*.tsv. Schalten Sie die Reichweitenprüfung der Länder aus, um den eigenen Durchlauf des Spiels zu messen."
