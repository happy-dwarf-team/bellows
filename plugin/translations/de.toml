# The plugin's texts in German: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Schnellerer Start, schnellere Simulation und schnelleres Speichern in Europa Universalis IV, ohne Änderung an Spieldateien oder Regeln."
"Faster memory allocator" = "Schnellerer Speicherallokator"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "Ein schnellerer Allokator (mimalloc) für das Spiel, bis zum Hauptmenü oder für die ganze Sitzung."
"Start-up" = "Start"
"File warm-up" = "Vorab-Öffnen von Dateien"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "Öffnet die Dateien, die das Spiel braucht, im Voraus. Hilft am meisten beim ersten Start nach einem Neustart des Rechners."
"RAM prefetch" = "RAM-Vorabladen"
"Unpacks the DLC archives the game needs into RAM in the background." = "Entpackt die DLC-Archive, die das Spiel braucht, im Hintergrund in den RAM."
"Path check cache" = "Cache der Pfadprüfungen"
"Answers the game's file path checks from folder listings." = "Beantwortet die Dateipfadprüfungen des Spiels aus Ordnerlisten."
"Lookups from listings" = "Suchen aus Ordnerlisten"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "Beantwortet „ist diese Datei hier?“ aus Ordnerlisten, für große Mod-Sets wie Anbennar. Braucht den Cache der Pfadprüfungen."
"File existence index" = "Index vorhandener Dateien"
"Answers the modifier icons' \"does this file exist\" check faster." = "Beantwortet die Prüfung „gibt es diese Datei?“ der Modifikatorsymbole schneller."
"Trigger profile lookup" = "Suche im Trigger-Profil"
"Faster trigger lookups at the end of loading." = "Schnellere Trigger-Suche am Ende des Ladens."
"Parameter substitution" = "Parameterersetzung"
"Fills $parameters$ in scripted effects and triggers in one pass." = "Füllt $parameters$ in geskripteten Effekten und Triggern in einem Durchgang."
"Conditional blocks" = "Bedingte Blöcke"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "Löst [[parameter]]-Blöcke in einem Durchgang auf. Großer Gewinn bei Mods mit großen geskripteten Effekten."
"Missing-file cache" = "Cache fehlender Dateien"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "Merkt sich fehlende Dateien beim Start. Ein kleiner Gewinn, etwa 0,1 s."
"Keyword cache" = "Schlüsselwort-Cache"
"Caches the script reader's keyword lookups." = "Speichert die Schlüsselwortsuchen des Skript-Lesers zwischen."
"Dated lists while loading" = "Datierte Listen beim Laden"
"Adds dated history entries without rescanning the list. Same list." = "Fügt datierte Geschichtseinträge hinzu, ohne die Liste erneut zu durchsuchen. Dieselbe Liste."
"Loading" = "Laden"
"Checksum after the databases" = "Prüfsumme nach den Datenbanken"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "Startet die Prüfsumme des Spiels nach dem Laden der Datenbanken; etwa 1 s weniger beim Start eines großen Mod-Sets."
"Path checks after start-up" = "Pfadprüfungen nach dem Start"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "Behält den Cache der Pfadprüfungen nach dem Hauptmenü, sodass ein Spielstand etwa 1,8 s früher lädt. Braucht den Cache der Pfadprüfungen."
"Country range check" = "Reichweitenprüfung der Länder"
"Answers the country range check from the last province in range. Same answers." = "Beantwortet die Reichweitenprüfung der Länder von der letzten Provinz in Reichweite aus. Dieselben Antworten."
"Simulation" = "Simulation"
"Frame pacing at speed 5" = "Frame-Pacing auf Geschwindigkeit 5"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "Zeichnet auf Geschwindigkeit 5 weniger Frames, solange Sie nichts tun; ein Jahr vergeht etwa 10 % schneller."
"Online service pacing" = "Takt der Online-Dienste"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "Führt die Prüfungen der Paradox-Onlinedienste auf Geschwindigkeit 5 seltener aus. Nicht im Mehrspielermodus."
"Full speed while minimized" = "Volle Geschwindigkeit bei minimiertem Fenster"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "Hält Geschwindigkeit 5 bei minimiertem Spiel auf vollem Tempo. Einzelspieler; braucht mehr CPU."
"Modifier merge index" = "Index für das Zusammenführen von Modifikatoren"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "Führt große Modifikatorlisten mit einem Index zusammen; ein Jahr auf Geschwindigkeit 5 vergeht etwa 5 % schneller."
"Port table" = "Hafentabelle"
"Builds each country's nearest-port table from its list of ports. Same table." = "Baut die Tabelle der nächsten Häfen jedes Landes aus seiner Hafenliste auf. Dieselbe Tabelle."
"Province modifier view" = "Direktansicht der Provinzmodifikatoren"
"Reads province modifiers in place instead of copying them. Same values." = "Liest Provinzmodifikatoren direkt, statt sie zu kopieren. Dieselben Werte."
"AI army search memo" = "Merkzettel der KI-Armeesuche"
"Remembers each army's facts in the AI's daily army search. Same answers." = "Merkt sich die Angaben jeder Armee in der täglichen KI-Armeesuche. Dieselben Antworten."
"Save compression" = "Spielstand-Komprimierung"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "Komprimiert Spielstände schneller. Die Datei ist Byte für Byte die des Spiels, außer Sie wählen mehrere Threads."
"Saving" = "Speichern"
"Skip transfer compression" = "Transfer-Komprimierung überspringen"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "Überspringt im Einzelspielermodus das Komprimieren eines Spielstands für eine Mehrspieler-Übertragung, die niemand empfängt."
"Diagnostics" = "Diagnose"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "Labor-Werkzeuge: Zeitprofile und Prüfungen gegen den eigenen Code des Spiels. Langsamer; zum Testen von Bellows."
"For testing" = "Zum Testen"
"Used for" = "Verwendung"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "Bis zum Hauptmenü, danach nutzen Allokationen wieder den Windows-Heap; oder für die ganze Sitzung."
"Until the main menu" = "Bis zum Hauptmenü"
"Whole session" = "Ganze Sitzung"
"Memory budget (MB)" = "Speicherbudget (MB)"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "RAM für entpackte Dateien, die das Spiel noch nicht abgeholt hat; ein Start nutzt höchstens ein Viertel des freien Speichers."
"Interval (ms)" = "Intervall (ms)"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "Kürzeste Zeit zwischen Frames auf Geschwindigkeit 5, solange Sie nichts tun (die des Spiels sind 50 ms); 0 behält die des Spiels."
"When you press a key or click" = "Wenn Sie eine Taste drücken oder klicken"
"React at once draws a frame for every input; waiting skips more frames." = "Sofort reagieren zeichnet für jede Eingabe einen Frame; Warten überspringt mehr Frames."
"React at once" = "Sofort reagieren"
"Wait for the interval" = "Auf das Intervall warten"
"Compress on several threads" = "Auf mehreren Threads komprimieren"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "Schneller bei großen Spielständen; die Datei ist ein gültiger Spielstand, aber ihre Bytes unterscheiden sich von denen des Spiels."
"Daily tick profile" = "Profil des täglichen Ticks"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "Dauer jeder Stufe des täglichen, monatlichen und jährlichen Ticks, in tick_profile*.tsv."
"Profiles" = "Profile"
"AI army search profile" = "Profil der KI-Armeesuche"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Aufrufe, Zeit und wiederholte Antworten der KI-Armeesuche, in army_search*.tsv."
"AI scoring probe" = "Messsonde der KI-Bewertung"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "Wie oft sich die Bewertungseingaben der KI-Armeesuche innerhalb eines Tages wiederholen, in score_probe.tsv."
"Monthly tick probe" = "Messsonde des monatlichen Ticks"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "Dauer der Aktualisierungen des monatlichen Ticks, der Modifikator-Zusammenführungen und der Zufallsziehungen, in monthly_probe*.tsv."
"ZIP read profile" = "Profil der ZIP-Lesezugriffe"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "In ZIP-Lesezugriffen und Inflate verbrachte Zeit pro Thread, in anvil.log."
"Keyword lookup profile" = "Profil der Schlüsselwortsuchen"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "Die Schlüsselwortsuchen des Skript-Lesers; schalten Sie den Schlüsselwort-Cache für saubere Zählungen aus."
"Range check profile" = "Profil der Reichweitenprüfung"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "Zähler der Reichweitenprüfung der Länder, in range_profile*.tsv; schalten Sie dieses Modul aus, um den Durchlauf des Spiels zu messen."
"Check: Path check cache" = "Prüfung: Cache der Pfadprüfungen"
"Runs the game's own code as well and counts differences. Slower." = "Führt zusätzlich den eigenen Code des Spiels aus und zählt Abweichungen. Langsamer."
"Check: Lookups from listings" = "Prüfung: Suchen aus Ordnerlisten"
"Check: File existence index" = "Prüfung: Index vorhandener Dateien"
"Check: Trigger profile lookup" = "Prüfung: Suche im Trigger-Profil"
"Check: Parameter substitution" = "Prüfung: Parameterersetzung"
"Check: Conditional blocks" = "Prüfung: Bedingte Blöcke"
"Check: RAM prefetch" = "Prüfung: RAM-Vorabladen"
"Check: Missing-file cache" = "Prüfung: Cache fehlender Dateien"
"Check: Keyword cache" = "Prüfung: Schlüsselwort-Cache"
"Check: Dated lists while loading" = "Prüfung: Datierte Listen beim Laden"
"Check: Checksum after the databases" = "Prüfung: Prüfsumme nach den Datenbanken"
"Logs the checksum task's times." = "Protokolliert die Zeiten der Prüfsummen-Aufgabe."
"Check: Country range check" = "Prüfung: Reichweitenprüfung der Länder"
"Check: Online service pacing" = "Prüfung: Takt der Online-Dienste"
"Runs the callbacks as the game does and counts what pacing would leave out." = "Führt die Rückrufe wie das Spiel aus und zählt, was der Takt auslassen würde."
"Check: Modifier merge index" = "Prüfung: Index für das Zusammenführen von Modifikatoren"
"Check: Port table" = "Prüfung: Hafentabelle"
"Check: Province modifier view" = "Prüfung: Direktansicht der Provinzmodifikatoren"
"Check: AI army search memo" = "Prüfung: Merkzettel der KI-Armeesuche"
"Check: Save compression" = "Prüfung: Spielstand-Komprimierung"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "Komprimiert zusätzlich wie das Spiel und vergleicht; auf mehreren Threads dekodiert es jeden Teil erneut."
"Check: Skip transfer compression" = "Prüfung: Transfer-Komprimierung überspringen"
"Keeps the game's copy and checks that nothing reads it." = "Behält die Kopie des Spiels und prüft, dass nichts sie liest."
