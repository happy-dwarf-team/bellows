# The plugin's texts in Simplified Chinese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "更快的《欧陆风云 IV》启动、模拟和存档，不改动游戏文件或规则。"
"Faster memory allocator" = "更快的内存分配器"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "为游戏提供更快的分配器（mimalloc），用到主菜单为止或用于整个会话。"
"Start-up" = "启动"
"File warm-up" = "预先打开文件"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "提前打开游戏需要的文件。对电脑重启后的首次启动帮助最大。"
"RAM prefetch" = "内存预读"
"Unpacks the DLC archives the game needs into RAM in the background." = "在后台把游戏需要的 DLC 压缩包解压到内存中。"
"Path check cache" = "路径检查缓存"
"Answers the game's file path checks from folder listings." = "根据文件夹列表回答游戏的文件路径检查。"
"Lookups from listings" = "根据列表查找"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "根据文件夹列表回答“此文件是否在这里”，适用于 Anbennar 这类大型模组组合。需要路径检查缓存。"
"File existence index" = "文件存在索引"
"Answers the modifier icons' \"does this file exist\" check faster." = "更快地回答修正图标的“此文件是否存在”检查。"
"Trigger profile lookup" = "触发器分析查找"
"Faster trigger lookups at the end of loading." = "在加载结束时更快地查找触发器。"
"Parameter substitution" = "参数替换"
"Fills $parameters$ in scripted effects and triggers in one pass." = "在脚本效果和触发器中一次填入 $parameters$。"
"Conditional blocks" = "条件块"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "一次解析 [[parameter]] 块。对含有大型脚本效果的模组提升明显。"
"Missing-file cache" = "缺失文件缓存"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "在启动期间记住缺失的文件。提升很小，约 0.1 秒。"
"Keyword cache" = "关键字缓存"
"Caches the script reader's keyword lookups." = "缓存脚本读取器的关键字查找。"
"Dated lists while loading" = "加载时的日期列表"
"Adds dated history entries without rescanning the list. Same list." = "添加带日期的历史条目时不再重新扫描列表。列表相同。"
"Loading" = "加载"
"Checksum after the databases" = "数据库之后再计算校验和"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "在数据库加载完成后才开始游戏的校验和；大型模组组合的启动快约 1 秒。"
"Path checks after start-up" = "启动后的路径检查"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "主菜单出现后仍保留路径检查缓存，因此存档载入快约 1.8 秒。需要路径检查缓存。"
"Country range check" = "国家范围检查"
"Answers the country range check from the last province in range. Same answers." = "从上次处于范围内的省份开始回答国家范围检查。结果相同。"
"Simulation" = "模拟"
"Frame pacing at speed 5" = "5 速时的帧节奏"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "你没有操作时，在 5 速下绘制更少的帧；一年快约 10%。"
"Online service pacing" = "在线服务节流"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "在 5 速下降低 Paradox 在线服务检查的频率。多人游戏中不使用。"
"Full speed while minimized" = "最小化时全速运行"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "游戏最小化时仍让 5 速全速运行。仅限单人游戏；占用更多 CPU。"
"Modifier merge index" = "修正合并索引"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "使用索引合并大型修正列表；5 速下一年快约 5%。"
"Port table" = "港口表"
"Builds each country's nearest-port table from its list of ports. Same table." = "根据每个国家的港口列表建立其最近港口表。表格相同。"
"Province modifier view" = "省份修正直读"
"Reads province modifiers in place instead of copying them. Same values." = "直接读取省份修正，而不是复制它们。数值相同。"
"AI army search memo" = "AI 军队搜索缓存"
"Remembers each army's facts in the AI's daily army search. Same answers." = "在 AI 每日的军队搜索中记住每支军队的信息。结果相同。"
"Save compression" = "存档压缩"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "更快地压缩存档。除非选择多线程，文件与游戏生成的逐字节相同。"
"Saving" = "存档"
"Skip transfer compression" = "跳过传输压缩"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "在单人游戏中，跳过为无人接收的多人传输压缩存档。"
"Diagnostics" = "诊断"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "实验工具：耗时分析以及与游戏自身代码的对照检查。会更慢；用于测试 Bellows。"
"For testing" = "测试用"
"Used for" = "使用范围"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "到主菜单为止（之后的分配重新使用 Windows 堆）；或用于整个会话。"
"Until the main menu" = "到主菜单为止"
"Whole session" = "整个会话"
"Memory budget (MB)" = "内存预算（MB）"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "用于存放已解压但游戏尚未取走的文件的内存；每次启动最多使用可用内存的四分之一。"
"Interval (ms)" = "间隔（ms）"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "你没有操作时，5 速下帧之间的最短间隔（游戏自身为 50 ms）；0 保持游戏的间隔。"
"When you press a key or click" = "按键或点击时"
"React at once draws a frame for every input; waiting skips more frames." = "立即响应会为每次输入绘制一帧；等待会跳过更多帧。"
"React at once" = "立即响应"
"Wait for the interval" = "等待间隔"
"Compress on several threads" = "多线程压缩"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "对大型存档更快；文件是有效的存档，但其字节与游戏生成的不同。"
"Daily tick profile" = "每日刻分析"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "每日、每月和每年刻各阶段的耗时，写入 tick_profile*.tsv。"
"Profiles" = "性能分析"
"AI army search profile" = "AI 军队搜索分析"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "AI 军队搜索的调用次数、耗时和重复结果，写入 army_search*.tsv。"
"AI scoring probe" = "AI 评分探针"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "AI 军队搜索的评分输入在一天内重复的频率，写入 score_probe.tsv。"
"Monthly tick probe" = "每月刻探针"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "每月刻的更新、修正合并以及随机抽取的耗时，写入 monthly_probe*.tsv。"
"ZIP read profile" = "ZIP 读取分析"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "每个线程在 ZIP 读取和解压（inflate）上花费的时间，写入 anvil.log。"
"Keyword lookup profile" = "关键字查找分析"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "脚本读取器的关键字查找；要得到准确的计数，请关闭关键字缓存。"
"Range check profile" = "范围检查分析"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "国家范围检查的计数器，写入 range_profile*.tsv；要测量游戏自身的遍历，请关闭该模块。"
"Check: Path check cache" = "校验：路径检查缓存"
"Runs the game's own code as well and counts differences. Slower." = "同时运行游戏自身的代码并统计差异。会更慢。"
"Check: Lookups from listings" = "校验：根据列表查找"
"Check: File existence index" = "校验：文件存在索引"
"Check: Trigger profile lookup" = "校验：触发器分析查找"
"Check: Parameter substitution" = "校验：参数替换"
"Check: Conditional blocks" = "校验：条件块"
"Check: RAM prefetch" = "校验：内存预读"
"Check: Missing-file cache" = "校验：缺失文件缓存"
"Check: Keyword cache" = "校验：关键字缓存"
"Check: Dated lists while loading" = "校验：加载时的日期列表"
"Check: Checksum after the databases" = "校验：数据库之后再计算校验和"
"Logs the checksum task's times." = "记录校验和任务的耗时。"
"Check: Country range check" = "校验：国家范围检查"
"Check: Online service pacing" = "校验：在线服务节流"
"Runs the callbacks as the game does and counts what pacing would leave out." = "按游戏的方式运行回调，并统计节流会省略的部分。"
"Check: Modifier merge index" = "校验：修正合并索引"
"Check: Port table" = "校验：港口表"
"Check: Province modifier view" = "校验：省份修正直读"
"Check: AI army search memo" = "校验：AI 军队搜索缓存"
"Check: Save compression" = "校验：存档压缩"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "同时按游戏的方式压缩并比较；使用多线程时重新解码每个部分。"
"Check: Skip transfer compression" = "校验：跳过传输压缩"
"Keeps the game's copy and checks that nothing reads it." = "保留游戏的副本并检查没有任何地方读取它。"
