# The plugin's texts in Simplified Chinese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "更快的《欧陆风云 IV》启动、模拟和存档，不改动游戏文件或规则。"
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "为游戏的 C 运行库提供更快的内存分配器：用于整个游戏会话，或仅到主菜单为止（之后的分配使用 Windows 堆）。"
"Start-up" = "启动"
"On" = "开启"
"Start-up only" = "仅启动时"
"Off" = "关闭"
"PhysFS path checks" = "PhysFS 路径检查"
"Answers PhysFS path checks from directory listings." = "根据目录列表回答 PhysFS 的路径检查。"
"Verify" = "校验"
"File existence index" = "文件存在索引"
"Answers \"does this file exist\" for the modifier icon check." = "为修正图标检查回答“此文件是否存在”。"
"Trigger profile lookup" = "触发器分析查找"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "在加载结束时，更快地在游戏的触发器分析表中查找每个触发器。"
"Parameter substitution" = "参数替换"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "在脚本效果和触发器中一次完成 $parameter$ 替换。"
"Conditional blocks" = "条件块"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "在脚本效果和触发器中一次解析 [[parameter] ...] 块（对含有大型脚本效果的模组提升明显，例如 Anbennar）。"
"Open warm-up" = "预先打开文件"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "在并行线程上提前打开游戏将要用到的文件（用于电脑重启后的首次启动）。"
"RAM prefetch" = "内存预读"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "在工作线程上把游戏将要用到的 DLC 压缩包成员读入内存并解压。"
"RAM prefetch budget (MB)" = "内存预读预算（MB）"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "用于存放已解压但游戏尚未取走的压缩包成员的内存。每次启动最多使用当时可用内存的四分之一。"
"Missing-file cache" = "缺失文件缓存"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "在启动期间记住游戏和模组文件的“文件未找到”结果（在其他模块之外最多节省约 0.1 秒）。"
"Tokenizer keyword cache" = "分词器关键字缓存"
"Caches the script tokenizer's keyword lookups." = "缓存脚本分词器的关键字查找。"
"PhysFS path checks after start-up" = "启动后的 PhysFS 路径检查"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "加载：主菜单出现后仍根据目录列表回答 PhysFS 路径检查（在 verifypath_listing 开启时使用），因此载入存档时能提前约 1.8 秒找到其纹理。列表超过 30 秒后会重新读取。"
"Loading" = "加载"
"Dated lists while loading" = "加载时的日期列表"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "加载：把游戏刚读取的条目加入带日期的列表时，不再先遍历整个列表查看新条目是否已在其中。得到的列表相同。校验模式让游戏遍历并进行比较。"
"PhysFS lookups from listings" = "根据列表回答 PhysFS 查找"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "启动：根据 PhysFS 路径检查的目录列表（在 verifypath_listing 开启时使用）回答文件系统对文件夹的第二次查询（文件是否存在、打开不存在的文件）。已存在的文件仍由游戏打开。可省去 Anbennar 这类大型模组组合在其覆盖的每个文件夹中的失败打开操作。校验模式每次都询问游戏并统计差异。"
"Checksum after the databases" = "数据库之后再计算校验和"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "加载：游戏的校验和任务在数据库加载完成后才开始读取文件，因此不再与它们争夺文件系统锁。文件、顺序和菜单中显示的校验和都相同；Anbennar 这类大型模组组合的启动快约 1 秒，原版游戏没有可测出的差别。校验模式只记录该任务的耗时。"
"Country range check" = "国家范围检查"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "模拟而非启动：从上次处于范围内的省份开始回答国家范围检查；结果与游戏代码相同。"
"Simulation" = "模拟"
"Modifier merge index" = "修正合并索引"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "模拟：合并大型修正列表（每月更新中把每个国家的修正加到每支部队上）时使用索引，而不是逐条扫描，因此 5 速下一年快约 5%；条目、顺序和数值都相同。校验模式运行游戏自己的合并并比较。"
"Online service pacing" = "在线服务节流"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "模拟：在最快速度下，每 500 毫秒运行一次游戏的 Paradox 在线服务回调，而不是每帧两次。没有要传递的内容时，每次运行会让主线程休眠 1 毫秒。多人游戏保持游戏自身的频率。校验模式按游戏的方式运行它们并统计会被省略的部分。"
"Province modifier view" = "省份修正直读"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "模拟：在每日国家更新和 AI 中，直接读取省份修正中的一个值，而不是先复制整个列表；数值相同。校验模式运行游戏的复制并比较。"
"Port table" = "港口表"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "模拟：根据国家港口的单一列表重建其最近港口表，而不是为地图上的每个省份重新遍历其省份和外交关系；表格相同。校验模式运行游戏的函数并比较。"
"AI army search memo" = "AI 军队搜索缓存"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "模拟：在 AI 每日为每支军队进行的搜索、寻路以及列出部队从某省份出发的移动时，只计算一次该军队是否无视要塞控制区以及其速度修正，而不是每次移动都计算；结果相同。校验模式每次都运行游戏的检查并比较。"
"Frame pacing at speed 5" = "5 速时的帧节奏"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "模拟：在最快速度下，你没有操作时，减少在每日刻内绘制帧的次数（见间隔），因此一年快约 10%；按键或点击仍会立即得到一帧。模拟相同；5 速时地图每秒更新约 16 次而不是 22 次。"
"Frame pacing interval (ms)" = "帧节奏间隔（毫秒）"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "最快速度下在每日刻内绘制帧的最短间隔（游戏自身为 50 毫秒；更短的值保持游戏的间隔）。0 保持游戏的间隔，只统计帧数。帧节奏开启时立即生效。"
"Frame pacing while you play" = "操作时的帧节奏"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "在 5 速下按键、点击或滚动滚轮时帧节奏的做法：立即绘制一帧，使游戏的响应至少与关闭帧节奏时一样快（只在你没有操作时跳过帧）；或等待较长的间隔（0.12.0 的做法）。帧节奏开启时立即生效。"
"React at once" = "立即响应"
"Wait for the interval" = "等待间隔"
"Full speed while minimized" = "最小化时全速运行"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "模拟：单人游戏以 5 速运行时，跳过游戏在窗口最小化时每帧最多 100 毫秒的等待。最小化时一年所需时间因此减少约 40–60%；窗口可见时没有变化。5 速最小化时每秒占用更多处理器时间。暂停、菜单、其他速度和多人游戏保持游戏的等待。"
"Save compression" = "存档压缩"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "存档：压缩存档（compress_autosave 等）时不使用游戏逐字节计算的 CRC-32；文件与游戏生成的逐字节相同。校验模式同时运行游戏自己的压缩，写入其结果并比较两者。"
"Saving" = "存档"
"Parallel save compression" = "并行存档压缩"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "存档（需开启存档压缩）：在多个线程上压缩压缩存档中的大型成员（gamestate）。存档是有效的压缩包，游戏和其他工具都能照常读取，但其压缩字节与游戏生成的不同。校验模式在写入前重新解码每个成员。"
"Skip transfer compression" = "跳过传输压缩"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "单人游戏载入：不再为无人接收的多人传输压缩文本存档；游戏载入的文件与以前相同。作为主机的多人游戏保持不变。校验模式保留游戏的副本并检查没有任何地方读取它。"
"Daily tick profile" = "每日刻分析"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "诊断：每个游戏日中每日、每月和每年刻的各阶段以及其中绘制的帧的耗时，写入 tick_profile*.tsv。"
"Diagnostics" = "诊断"
"AI army search profile" = "AI 军队搜索分析"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "诊断：AI 军队搜索的调用次数、耗时和重复结果，写入 army_search*.tsv。"
"AI scoring probe" = "AI 评分探针"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "诊断：AI 军队搜索的评分函数的输入在一个游戏日内重复的频率，写入 score_probe.tsv。"
"Monthly tick probe" = "每月刻探针"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "诊断：每月刻中国家、省份和部队更新、修正合并以及随机抽取的耗时，写入 monthly_probe*.tsv。"
"ZIP read profile" = "ZIP 读取分析"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "诊断：每个线程在 ZIP 读取和解压（inflate）上花费的时间，写入 anvil.log。"
"Tokenizer lookup profile" = "分词器查找分析"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "诊断：分词器的关键字查找。与分词器关键字缓存共用调用点；要得到准确的计数，请关闭该缓存。"
"Range check profile" = "范围检查分析"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "诊断：国家范围检查的计数器，写入 range_profile*.tsv。要测量游戏自身的遍历，请关闭国家范围检查。"
