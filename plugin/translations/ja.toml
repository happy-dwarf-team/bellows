# The plugin's texts in Japanese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Europa Universalis IV の起動、シミュレーション、セーブを高速化します。ゲームのファイルやルールは変更しません。"
"Faster memory allocator" = "高速なメモリアロケーター"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "ゲーム用の高速なアロケーター（mimalloc）。メインメニューまで、またはセッション全体で使います。"
"Start-up" = "起動"
"File warm-up" = "ファイルの先読みオープン"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "ゲームが必要とするファイルを先に開きます。PC の再起動後、最初の起動で最も効果があります。"
"RAM prefetch" = "RAM への先読み"
"Unpacks the DLC archives the game needs into RAM in the background." = "ゲームが必要とする DLC アーカイブを、バックグラウンドで RAM に展開します。"
"Path check cache" = "パス確認キャッシュ"
"Answers the game's file path checks from folder listings." = "ゲームのファイルパス確認にフォルダーの一覧から答えます。"
"Lookups from listings" = "一覧による検索"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "「このファイルはここにあるか」にフォルダーの一覧から答えます。Anbennar のような大きな MOD 構成向けです。パス確認キャッシュが必要です。"
"File existence index" = "ファイル存在インデックス"
"Answers the modifier icons' \"does this file exist\" check faster." = "修正アイコンの「このファイルはあるか」の確認により速く答えます。"
"Trigger profile lookup" = "トリガープロファイルの検索"
"Faster trigger lookups at the end of loading." = "読み込みの最後にトリガーをより速く検索します。"
"Parameter substitution" = "パラメーターの置換"
"Fills $parameters$ in scripted effects and triggers in one pass." = "スクリプト化された効果とトリガーの $parameters$ を 1 回の走査で埋めます。"
"Conditional blocks" = "条件ブロック"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "[[parameter]] ブロックを 1 回の走査で解決します。大きなスクリプト効果を持つ MOD で効果大です。"
"Missing-file cache" = "存在しないファイルのキャッシュ"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "起動中、存在しないファイルを記憶します。効果は小さく、約 0.1 秒です。"
"Keyword cache" = "キーワードキャッシュ"
"Caches the script reader's keyword lookups." = "スクリプトリーダーによるキーワード検索をキャッシュします。"
"Dated lists while loading" = "読み込み中の日付付きリスト"
"Adds dated history entries without rescanning the list. Same list." = "日付付きの履歴項目を、リストを走査し直さずに加えます。リストは同じです。"
"Loading" = "読み込み"
"Checksum after the databases" = "データベースの後にチェックサム"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "データベースの読み込み後にゲームのチェックサムを始めます。大きな MOD 構成では起動が約 1 秒短くなります。"
"Path checks after start-up" = "起動後のパス確認"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "メインメニューの後もパス確認キャッシュを保ち、セーブの読み込みが約 1.8 秒早くなります。パス確認キャッシュが必要です。"
"Country range check" = "国家の範囲判定"
"Answers the country range check from the last province in range. Same answers." = "国家の範囲判定に、最後に範囲内だったプロヴィンスから答えます。答えは同じです。"
"Simulation" = "シミュレーション"
"Frame pacing at speed 5" = "速度 5 でのフレーム間隔調整"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "何も操作していない間、速度 5 で描くフレームを減らします。1 年が約 10% 早く進みます。"
"Online service pacing" = "オンラインサービスの間隔調整"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "速度 5 では Paradox オンラインサービスの確認の頻度を下げます。マルチプレイでは使いません。"
"Full speed while minimized" = "最小化中もフルスピード"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "ゲームを最小化している間も速度 5 をフルスピードに保ちます。シングルプレイのみ。CPU 使用量が増えます。"
"Modifier merge index" = "修正の統合インデックス"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "大きな修正リストをインデックスで統合します。速度 5 で 1 年が約 5% 早く進みます。"
"Port table" = "港の表"
"Builds each country's nearest-port table from its list of ports. Same table." = "各国の最寄りの港の表を、その国の港の一覧から作ります。表は同じです。"
"Province modifier view" = "プロヴィンス修正の直接参照"
"Reads province modifiers in place instead of copying them. Same values." = "プロヴィンスの修正をコピーせずにその場で読みます。値は同じです。"
"AI army search memo" = "AI の軍の探索メモ"
"Remembers each army's facts in the AI's daily army search. Same answers." = "AI が毎日行う軍の探索で、各軍の情報を記憶します。答えは同じです。"
"Save compression" = "セーブの圧縮"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "セーブをより速く圧縮します。複数のスレッドを選ばない限り、ファイルはゲームのものとバイト単位で同じです。"
"Saving" = "セーブ"
"Skip transfer compression" = "転送用の圧縮を省く"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "シングルプレイでは、誰も受け取らないマルチプレイ転送のためのセーブの圧縮を省きます。"
"Diagnostics" = "診断"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "ラボ用ツール：時間のプロファイルと、ゲーム自身のコードとの照合。遅くなります。Bellows のテスト用です。"
"For testing" = "テスト用"
"Used for" = "使用範囲"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "メインメニューまで（その後の確保は再び Windows のヒープを使います）、またはセッション全体。"
"Until the main menu" = "メインメニューまで"
"Whole session" = "セッション全体"
"Memory budget (MB)" = "メモリの上限（MB）"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "展開済みでゲームがまだ受け取っていないファイル用の RAM。1 回の起動で使うのは空きメモリの 4 分の 1 までです。"
"Interval (ms)" = "間隔（ms）"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "何も操作していない間の速度 5 でのフレームの最短間隔（ゲーム本来は 50 ms）。0 はゲームの間隔のままです。"
"When you press a key or click" = "キーを押すかクリックしたとき"
"React at once draws a frame for every input; waiting skips more frames." = "「すぐに反応」は入力ごとにフレームを描きます。待つ場合はより多くのフレームを飛ばします。"
"React at once" = "すぐに反応"
"Wait for the interval" = "間隔まで待つ"
"Compress on several threads" = "複数のスレッドで圧縮"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "大きなセーブで速くなります。ファイルは正しいセーブですが、バイト列はゲームのものと異なります。"
"Daily tick profile" = "日次ティックのプロファイル"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "日次・月次・年次ティックの各段階の時間を tick_profile*.tsv に書き込みます。"
"Profiles" = "プロファイル"
"AI army search profile" = "AI の軍の探索プロファイル"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "AI の軍の探索の呼び出し回数、時間、繰り返された答えを army_search*.tsv に書き込みます。"
"AI scoring probe" = "AI の評価プローブ"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "AI の軍の探索の評価入力が 1 日の中でどれだけ繰り返されるかを score_probe.tsv に書き込みます。"
"Monthly tick probe" = "月次ティックのプローブ"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "月次ティックの更新、修正の統合、乱数の抽選にかかる時間を monthly_probe*.tsv に書き込みます。"
"ZIP read profile" = "ZIP 読み込みのプロファイル"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "スレッドごとに ZIP の読み込みと展開（inflate）にかかった時間を anvil.log に書き込みます。"
"Keyword lookup profile" = "キーワード検索のプロファイル"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "スクリプトリーダーのキーワード検索。正確な回数を得るにはキーワードキャッシュをオフにしてください。"
"Range check profile" = "範囲判定のプロファイル"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "国家の範囲判定のカウンターを range_profile*.tsv に書き込みます。ゲーム自身の走査を測るには、そのモジュールをオフにしてください。"
"Check: Path check cache" = "検証：パス確認キャッシュ"
"Runs the game's own code as well and counts differences. Slower." = "ゲーム自身のコードも実行し、違いを数えます。遅くなります。"
"Check: Lookups from listings" = "検証：一覧による検索"
"Check: File existence index" = "検証：ファイル存在インデックス"
"Check: Trigger profile lookup" = "検証：トリガープロファイルの検索"
"Check: Parameter substitution" = "検証：パラメーターの置換"
"Check: Conditional blocks" = "検証：条件ブロック"
"Check: RAM prefetch" = "検証：RAM への先読み"
"Check: Missing-file cache" = "検証：存在しないファイルのキャッシュ"
"Check: Keyword cache" = "検証：キーワードキャッシュ"
"Check: Dated lists while loading" = "検証：読み込み中の日付付きリスト"
"Check: Checksum after the databases" = "検証：データベースの後にチェックサム"
"Logs the checksum task's times." = "チェックサム処理の時間をログに書きます。"
"Check: Country range check" = "検証：国家の範囲判定"
"Check: Online service pacing" = "検証：オンラインサービスの間隔調整"
"Runs the callbacks as the game does and counts what pacing would leave out." = "コールバックをゲームと同じように実行し、間隔調整で省かれるはずの分を数えます。"
"Check: Modifier merge index" = "検証：修正の統合インデックス"
"Check: Port table" = "検証：港の表"
"Check: Province modifier view" = "検証：プロヴィンス修正の直接参照"
"Check: AI army search memo" = "検証：AI の軍の探索メモ"
"Check: Save compression" = "検証：セーブの圧縮"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "ゲームと同じ方法でも圧縮して比較します。複数のスレッドでは、各部分をもう一度展開します。"
"Check: Skip transfer compression" = "検証：転送用の圧縮を省く"
"Keeps the game's copy and checks that nothing reads it." = "ゲームのコピーを残し、何も読まないことを確かめます。"
