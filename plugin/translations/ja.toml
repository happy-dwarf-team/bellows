# The plugin's texts in Japanese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Europa Universalis IV の起動、シミュレーション、セーブを高速化します。ゲームのファイルやルールは変更しません。"
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "ゲームの C ランタイム用の高速なメモリアロケーター。ゲームのセッション全体で使うか、メインメニューまでだけ使います（その後の確保は Windows のヒープを使います）。"
"Start-up" = "起動"
"On" = "オン"
"Start-up only" = "起動時のみ"
"Off" = "オフ"
"PhysFS path checks" = "PhysFS のパス確認"
"Answers PhysFS path checks from directory listings." = "PhysFS のパス確認にディレクトリの一覧から答えます。"
"Verify" = "検証"
"File existence index" = "ファイル存在インデックス"
"Answers \"does this file exist\" for the modifier icon check." = "修正アイコンの確認で「このファイルはあるか」に答えます。"
"Trigger profile lookup" = "トリガープロファイルの検索"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "読み込みの最後に、ゲームのトリガープロファイルで各トリガーをより速く検索します。"
"Parameter substitution" = "パラメーターの置換"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "スクリプト化された効果とトリガーの $parameter$ の置換を 1 回の走査で行います。"
"Conditional blocks" = "条件ブロック"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "スクリプト化された効果とトリガーの [[parameter] ...] ブロックを 1 回の走査で解決します（Anbennar など、大きなスクリプト効果を持つ MOD で効果大）。"
"Open warm-up" = "ファイルの先読みオープン"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "ゲームが必要とするファイルを並列スレッドで先に開きます（PC の再起動後、最初の起動向け）。"
"RAM prefetch" = "RAM への先読み"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "ゲームが必要とする DLC アーカイブ内のファイルを、ワーカースレッドで RAM に読み込んで展開します。"
"RAM prefetch budget (MB)" = "RAM 先読みの上限（MB）"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "展開済みでゲームがまだ受け取っていないアーカイブ内ファイル用の RAM。1 回の起動で使うのは、その時点の空きメモリの 4 分の 1 までです。"
"Missing-file cache" = "存在しないファイルのキャッシュ"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "起動中、ゲームと MOD のファイルについて「ファイルが見つからない」という答えを記憶します（他のモジュールに加えて最大 0.1 秒ほど）。"
"Tokenizer keyword cache" = "トークナイザーのキーワードキャッシュ"
"Caches the script tokenizer's keyword lookups." = "スクリプトのトークナイザーによるキーワード検索をキャッシュします。"
"PhysFS path checks after start-up" = "起動後の PhysFS のパス確認"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "読み込み：メインメニューが表示された後も、PhysFS のパス確認にディレクトリ一覧から答え続けます（verifypath_listing がオンの間に使用）。セーブの読み込みでテクスチャが約 1.8 秒早く見つかります。一覧は 30 秒経つと読み直されます。"
"Loading" = "読み込み"
"Dated lists while loading" = "読み込み中の日付付きリスト"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "読み込み：ゲームが読み込んだばかりの項目を日付付きリストに加える際、その新しい項目がすでにあるかを確かめるためにリスト全体をたどることをしません。結果のリストは同じです。検証はゲームにたどらせて比較します。"
"PhysFS lookups from listings" = "一覧による PhysFS の検索"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "起動：ファイルシステムによるフォルダーの 2 回目の確認（ファイルがあるか、存在しないファイルを開く）に、PhysFS のパス確認のディレクトリ一覧（verifypath_listing がオンの間に使用）から答えます。存在するファイルは引き続きゲームが開きます。Anbennar のような大きな MOD 構成が上書きする各フォルダーで起こす、失敗するオープンを省きます。検証は毎回ゲームに問い合わせ、違いを数えます。"
"Checksum after the databases" = "データベースの後にチェックサム"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "読み込み：ゲームのチェックサム処理は、データベースの読み込みが終わってからファイルを読み始めるため、ファイルシステムのロックを奪い合わなくなります。ファイル、順序、メニューに表示されるチェックサムは同じです。Anbennar のような大きな MOD 構成では起動が約 1 秒短くなり、バニラでは測れるほどの差はありません。検証は処理の時間をログに書くだけです。"
"Country range check" = "国家の範囲判定"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "起動ではなくシミュレーション：国家の範囲判定に、前回範囲内だったプロヴィンスから答えます。答えはゲームのコードと同じです。"
"Simulation" = "シミュレーション"
"Modifier merge index" = "修正の統合インデックス"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "シミュレーション：大きな修正リスト（月次更新で各国の修正を各ユニットの修正に加えるもの）を、項目ごとの走査ではなくインデックスで加算します。速度 5 で 1 年が約 5% 早く進みます。項目、順序、値は同じです。検証はゲームの統合処理を実行して比較します。"
"Online service pacing" = "オンラインサービスの間隔調整"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "シミュレーション：最高速度では、ゲームの Paradox オンラインサービスのコールバックを 1 フレームに 2 回ではなく 500 ミリ秒ごとに実行します。届けるものがないときは、実行のたびにメインスレッドを 1 ミリ秒スリープさせます。マルチプレイではゲームの頻度のままです。検証はゲームと同じように実行し、省かれるはずの分を数えます。"
"Province modifier view" = "プロヴィンス修正の直接参照"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "シミュレーション：日次の国家更新と AI で、プロヴィンスの修正から値を 1 つ読むとき、先にリスト全体をコピーせずにその場で読みます。値は同じです。検証はゲームのコピーを実行して比較します。"
"Port table" = "港の表"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "シミュレーション：国家の最寄りの港の表を、マップの各プロヴィンスについて領土と関係を毎回たどり直すのではなく、その国の港の一覧 1 つから作り直します。表は同じです。検証はゲームの関数を実行して比較します。"
"AI army search memo" = "AI の軍の探索メモ"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "シミュレーション：AI が毎日各軍について行う探索、経路探索、プロヴィンスからのユニットの移動の列挙で、その軍が要塞の支配地域を無視するかどうかと速度修正を、移動ごとではなく 1 回だけ求めます。答えは同じです。検証は毎回ゲームの判定を実行して比較します。"
"Frame pacing at speed 5" = "速度 5 でのフレーム間隔調整"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "シミュレーション：最高速度で何も操作していない間、日次ティック内からのフレーム描画を減らします（間隔を参照）。1 年が約 10% 早く進みます。キーを押すかクリックすれば、すぐにフレームが描かれます。シミュレーションは同じです。速度 5 でのマップの更新は毎秒約 22 回から約 16 回になります。"
"Frame pacing interval (ms)" = "フレーム間隔調整の間隔（ミリ秒）"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "最高速度で日次ティック内に描くフレームの最短間隔（ゲーム本来は 50 ミリ秒。これより短い値ではゲームの間隔のまま）。0 はゲームの間隔のままでフレーム数を数えるだけです。フレーム間隔調整がオンなら、すぐに反映されます。"
"Frame pacing while you play" = "操作中のフレーム間隔調整"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "速度 5 でキーを押す、クリックする、ホイールを回すときのフレーム間隔調整の動作：すぐにフレームを描いて、調整なしと同じかそれより速く反応させる（フレームを飛ばすのは何も操作していない間だけ）か、長いほうの間隔まで待つ（0.12.0 の動作）か。フレーム間隔調整がオンなら、すぐに反映されます。"
"React at once" = "すぐに反応"
"Wait for the interval" = "間隔まで待つ"
"Full speed while minimized" = "最小化中もフルスピード"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "シミュレーション：シングルプレイを速度 5 で進めている間、ウィンドウを最小化しているときにゲームが入れる 1 フレームあたり最大 100 ミリ秒の待機を省きます。最小化中の 1 年は約 40～60% 短くなります。ウィンドウが表示されていれば何も変わりません。速度 5 で最小化している間は、1 秒あたりの CPU 時間が増えます。一時停止、メニュー、ほかの速度、マルチプレイではゲームの待機のままです。"
"Save compression" = "セーブの圧縮"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "セーブ：圧縮セーブ（compress_autosave など）で、ゲームの 1 バイトずつの CRC-32 を使いません。ファイルはゲームのものとバイト単位で同じです。検証はゲーム本来の圧縮も実行し、その結果を書き込んで両者を比較します。"
"Saving" = "セーブ"
"Parallel save compression" = "セーブの並列圧縮"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "セーブ（セーブの圧縮がオンのとき）：圧縮セーブの大きなファイル（gamestate）を複数のスレッドで圧縮します。セーブはゲームやほかのツールがこれまでどおり読める正しいアーカイブですが、圧縮後のバイト列はゲームのものと異なります。検証は書き込む前に各ファイルをもう一度展開します。"
"Skip transfer compression" = "転送用の圧縮を省く"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "シングルプレイでの読み込み：誰も受け取らないマルチプレイ転送のために、テキストセーブを圧縮しません。ゲームが読み込むファイルはこれまでと同じです。ホストするマルチプレイはそのままです。検証はゲームのコピーを残し、何も読まないことを確かめます。"
"Daily tick profile" = "日次ティックのプロファイル"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "診断：日次・月次・年次ティックの各段階と、その中で描かれたフレームの時間を、ゲーム内の 1 日ごとに tick_profile*.tsv に書き込みます。"
"Diagnostics" = "診断"
"AI army search profile" = "AI の軍の探索プロファイル"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "診断：AI の軍の探索の呼び出し回数、時間、繰り返された答えを army_search*.tsv に書き込みます。"
"AI scoring probe" = "AI の評価プローブ"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "診断：AI の軍の探索で使う評価関数の入力が、ゲーム内の 1 日の中でどれだけ繰り返されるかを score_probe.tsv に書き込みます。"
"Monthly tick probe" = "月次ティックのプローブ"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "診断：月次ティックの国家・プロヴィンス・ユニットの更新、修正の統合、乱数の抽選にかかる時間を monthly_probe*.tsv に書き込みます。"
"ZIP read profile" = "ZIP 読み込みのプロファイル"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "診断：スレッドごとに ZIP の読み込みと展開（inflate）にかかった時間を anvil.log に書き込みます。"
"Tokenizer lookup profile" = "トークナイザー検索のプロファイル"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "診断：トークナイザーのキーワード検索。呼び出し箇所をトークナイザーのキーワードキャッシュと共有するので、正確な回数を得るにはキャッシュをオフにしてください。"
"Range check profile" = "範囲判定のプロファイル"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "診断：国家の範囲判定のカウンターを range_profile*.tsv に書き込みます。ゲーム自身の走査を測るには、国家の範囲判定をオフにしてください。"
