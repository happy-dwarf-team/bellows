# The plugin's texts in French: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Démarrage, simulation et sauvegardes d'Europa Universalis IV plus rapides, sans modifier les fichiers ni les règles du jeu."
"Faster memory allocator" = "Allocateur de mémoire plus rapide"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "Un allocateur plus rapide (mimalloc) pour le jeu, jusqu'au menu principal ou pour toute la session."
"Start-up" = "Démarrage"
"File warm-up" = "Préouverture des fichiers"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "Ouvre à l'avance les fichiers dont le jeu a besoin. Aide surtout au premier lancement après un redémarrage de l'ordinateur."
"RAM prefetch" = "Préchargement en RAM"
"Unpacks the DLC archives the game needs into RAM in the background." = "Décompresse en RAM, en arrière-plan, les archives de DLC dont le jeu a besoin."
"Path check cache" = "Cache des vérifications de chemins"
"Answers the game's file path checks from folder listings." = "Répond aux vérifications de chemins de fichiers du jeu à partir des listes de dossiers."
"Lookups from listings" = "Recherches depuis les listes"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "Répond à « ce fichier est-il ici ? » à partir des listes de dossiers, pour les gros ensembles de mods comme Anbennar. Nécessite le cache des vérifications de chemins."
"File existence index" = "Index d'existence des fichiers"
"Answers the modifier icons' \"does this file exist\" check faster." = "Répond plus vite à la vérification « ce fichier existe-t-il ? » des icônes de modificateurs."
"Trigger profile lookup" = "Recherche dans le profil des déclencheurs"
"Faster trigger lookups at the end of loading." = "Recherche plus rapide des déclencheurs à la fin du chargement."
"Parameter substitution" = "Substitution des paramètres"
"Fills $parameters$ in scripted effects and triggers in one pass." = "Remplit les $parameters$ des effets et déclencheurs scriptés en une seule passe."
"Conditional blocks" = "Blocs conditionnels"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "Résout les blocs [[parameter]] en une seule passe. Gain important pour les mods aux gros effets scriptés."
"Missing-file cache" = "Cache des fichiers absents"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "Mémorise les fichiers absents pendant le démarrage. Un petit gain, environ 0,1 s."
"Keyword cache" = "Cache des mots-clés"
"Caches the script reader's keyword lookups." = "Met en cache les recherches de mots-clés du lecteur de scripts."
"Dated lists while loading" = "Listes datées au chargement"
"Adds dated history entries without rescanning the list. Same list." = "Ajoute les entrées d'historique datées sans parcourir à nouveau la liste. Même liste."
"Loading" = "Chargement"
"Checksum after the databases" = "Somme de contrôle après les bases de données"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "Lance la somme de contrôle du jeu après le chargement des bases de données ; environ 1 s de moins au démarrage d'un gros ensemble de mods."
"Path checks after start-up" = "Vérifications de chemins après le démarrage"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "Garde le cache des vérifications de chemins après le menu principal, si bien qu'une sauvegarde se charge environ 1,8 s plus tôt. Nécessite le cache des vérifications de chemins."
"Country range check" = "Vérification de portée des pays"
"Answers the country range check from the last province in range. Same answers." = "Répond à la vérification de portée des pays à partir de la dernière province à portée. Mêmes réponses."
"Simulation" = "Simulation"
"Frame pacing at speed 5" = "Cadence d'images en vitesse 5"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "Dessine moins d'images en vitesse 5 tant que vous ne faites rien ; une année passe environ 10 % plus vite."
"Online service pacing" = "Cadence des services en ligne"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "Exécute moins souvent les vérifications des services en ligne Paradox en vitesse 5. Pas en multijoueur."
"Full speed while minimized" = "Pleine vitesse fenêtre réduite"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "Garde la vitesse 5 à plein régime quand le jeu est réduit. Solo ; utilise plus de CPU."
"Modifier merge index" = "Index de fusion des modificateurs"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "Fusionne les grandes listes de modificateurs avec un index ; une année en vitesse 5 passe environ 5 % plus vite."
"Port table" = "Table des ports"
"Builds each country's nearest-port table from its list of ports. Same table." = "Construit la table des ports les plus proches de chaque pays à partir de sa liste de ports. Même table."
"Province modifier view" = "Lecture directe des modificateurs de province"
"Reads province modifiers in place instead of copying them. Same values." = "Lit les modificateurs de province sur place au lieu de les copier. Mêmes valeurs."
"AI army search memo" = "Mémo de la recherche d'armées de l'IA"
"Remembers each army's facts in the AI's daily army search. Same answers." = "Mémorise les données de chaque armée dans la recherche quotidienne d'armées de l'IA. Mêmes réponses."
"Save compression" = "Compression des sauvegardes"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "Compresse les sauvegardes plus vite. Le fichier est identique octet pour octet à celui du jeu, sauf si vous choisissez plusieurs threads."
"Saving" = "Sauvegarde"
"Skip transfer compression" = "Ignorer la compression de transfert"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "En solo, ne compresse pas une sauvegarde pour un transfert multijoueur que personne ne reçoit."
"Diagnostics" = "Diagnostic"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "Outils de laboratoire : profils de temps et vérifications par rapport au code du jeu lui-même. Plus lent ; pour tester Bellows."
"For testing" = "Pour les tests"
"Used for" = "Utilisation"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "Jusqu'au menu principal, après quoi les allocations utilisent de nouveau le tas de Windows ; ou pour toute la session."
"Until the main menu" = "Jusqu'au menu principal"
"Whole session" = "Toute la session"
"Memory budget (MB)" = "Budget mémoire (MB)"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "RAM pour les fichiers décompressés que le jeu n'a pas encore pris ; un lancement utilise au plus un quart de la mémoire libre."
"Interval (ms)" = "Intervalle (ms)"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "Temps minimal entre deux images en vitesse 5 tant que vous ne faites rien (celui du jeu est de 50 ms) ; 0 garde celui du jeu."
"When you press a key or click" = "Quand vous appuyez sur une touche ou cliquez"
"React at once draws a frame for every input; waiting skips more frames." = "Réagir aussitôt dessine une image à chaque action ; attendre saute plus d'images."
"React at once" = "Réagir aussitôt"
"Wait for the interval" = "Attendre l'intervalle"
"Compress on several threads" = "Compresser sur plusieurs threads"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "Plus rapide pour les grosses sauvegardes ; le fichier est une sauvegarde valide, mais ses octets diffèrent de ceux du jeu."
"Daily tick profile" = "Profil du tick quotidien"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "Durée de chaque étape du tick quotidien, mensuel et annuel, dans tick_profile*.tsv."
"Profiles" = "Profils"
"AI army search profile" = "Profil de la recherche d'armées de l'IA"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Appels, durée et réponses répétées de la recherche d'armées de l'IA, dans army_search*.tsv."
"AI scoring probe" = "Sonde de notation de l'IA"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "Fréquence à laquelle les entrées de notation de la recherche d'armées de l'IA se répètent au cours d'une journée, dans score_probe.tsv."
"Monthly tick probe" = "Sonde du tick mensuel"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "Durée des mises à jour du tick mensuel, des fusions de modificateurs et des tirages aléatoires, dans monthly_probe*.tsv."
"ZIP read profile" = "Profil des lectures ZIP"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "Temps passé dans les lectures ZIP et la décompression (inflate) par thread, dans anvil.log."
"Keyword lookup profile" = "Profil des recherches de mots-clés"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "Les recherches de mots-clés du lecteur de scripts ; désactivez le cache des mots-clés pour des comptes exacts."
"Range check profile" = "Profil de la vérification de portée"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "Compteurs de la vérification de portée des pays, dans range_profile*.tsv ; désactivez ce module pour mesurer le parcours du jeu."
"Check: Path check cache" = "Contrôle : Cache des vérifications de chemins"
"Runs the game's own code as well and counts differences. Slower." = "Exécute aussi le code du jeu lui-même et compte les différences. Plus lent."
"Check: Lookups from listings" = "Contrôle : Recherches depuis les listes"
"Check: File existence index" = "Contrôle : Index d'existence des fichiers"
"Check: Trigger profile lookup" = "Contrôle : Recherche dans le profil des déclencheurs"
"Check: Parameter substitution" = "Contrôle : Substitution des paramètres"
"Check: Conditional blocks" = "Contrôle : Blocs conditionnels"
"Check: RAM prefetch" = "Contrôle : Préchargement en RAM"
"Check: Missing-file cache" = "Contrôle : Cache des fichiers absents"
"Check: Keyword cache" = "Contrôle : Cache des mots-clés"
"Check: Dated lists while loading" = "Contrôle : Listes datées au chargement"
"Check: Checksum after the databases" = "Contrôle : Somme de contrôle après les bases de données"
"Logs the checksum task's times." = "Journalise les temps de la tâche de somme de contrôle."
"Check: Country range check" = "Contrôle : Vérification de portée des pays"
"Check: Online service pacing" = "Contrôle : Cadence des services en ligne"
"Runs the callbacks as the game does and counts what pacing would leave out." = "Exécute les rappels comme le jeu et compte ce que la cadence omettrait."
"Check: Modifier merge index" = "Contrôle : Index de fusion des modificateurs"
"Check: Port table" = "Contrôle : Table des ports"
"Check: Province modifier view" = "Contrôle : Lecture directe des modificateurs de province"
"Check: AI army search memo" = "Contrôle : Mémo de la recherche d'armées de l'IA"
"Check: Save compression" = "Contrôle : Compression des sauvegardes"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "Compresse aussi comme le jeu et compare ; sur plusieurs threads, décode à nouveau chaque partie."
"Check: Skip transfer compression" = "Contrôle : Ignorer la compression de transfert"
"Keeps the game's copy and checks that nothing reads it." = "Garde la copie du jeu et contrôle que rien ne la lit."
