# The plugin's texts in French: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Démarrage, simulation et sauvegardes d'Europa Universalis IV plus rapides, sans modifier les fichiers ni les règles du jeu."
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "Allocateur de mémoire plus rapide pour le runtime C du jeu : pour toute la session de jeu, ou seulement jusqu'au menu principal (les allocations suivantes utilisent le tas de Windows)."
"Start-up" = "Démarrage"
"On" = "Activé"
"Start-up only" = "Démarrage seulement"
"Off" = "Désactivé"
"PhysFS path checks" = "Vérifications de chemins PhysFS"
"Answers PhysFS path checks from directory listings." = "Répond aux vérifications de chemins PhysFS à partir des listes de répertoires."
"Verify" = "Vérifier"
"File existence index" = "Index d'existence des fichiers"
"Answers \"does this file exist\" for the modifier icon check." = "Répond à « ce fichier existe-t-il ? » pour la vérification des icônes de modificateurs."
"Trigger profile lookup" = "Recherche dans le profil des déclencheurs"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "Recherche plus rapide de chaque déclencheur dans le profil des déclencheurs du jeu à la fin du chargement."
"Parameter substitution" = "Substitution des paramètres"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "Substitution de $parameter$ en une seule passe dans les effets et déclencheurs scriptés."
"Conditional blocks" = "Blocs conditionnels"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "Résolution en une seule passe des blocs [[parameter] ...] dans les effets et déclencheurs scriptés (gain important pour les mods aux gros effets scriptés, p. ex. Anbennar)."
"Open warm-up" = "Préouverture des fichiers"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "Ouvre à l'avance, sur des threads parallèles, les fichiers dont le jeu aura besoin (prévu pour le premier lancement après un redémarrage de l'ordinateur)."
"RAM prefetch" = "Préchargement en RAM"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "Lit et décompresse en RAM, sur des threads de travail, les fichiers des archives de DLC dont le jeu aura besoin."
"RAM prefetch budget (MB)" = "Budget du préchargement en RAM (Mo)"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "Mémoire vive pour les fichiers d'archive décompressés que le jeu n'a pas encore pris. Un lancement utilise au plus un quart de la mémoire libre à ce moment."
"Missing-file cache" = "Cache des fichiers absents"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "Mémorise les réponses « fichier introuvable » pour les fichiers du jeu et des mods pendant le démarrage (au plus ~0,1 s en plus des autres modules)."
"Tokenizer keyword cache" = "Cache des mots-clés du tokeniseur"
"Caches the script tokenizer's keyword lookups." = "Met en cache les recherches de mots-clés du tokeniseur de scripts."
"PhysFS path checks after start-up" = "Vérifications de chemins PhysFS après le démarrage"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "Chargement : continue de répondre aux vérifications de chemins PhysFS à partir des listes de répertoires une fois le menu principal affiché (utilisé tant que verifypath_listing est activé), si bien que le chargement d'une sauvegarde trouve ses textures environ 1,8 s plus tôt. Une liste est relue après 30 s."
"Loading" = "Chargement"
"Dated lists while loading" = "Listes datées au chargement"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "Chargement : ajoute une entrée que le jeu vient de lire à une liste datée sans parcourir d'abord toute la liste pour voir si cette nouvelle entrée s'y trouve. La liste obtenue est la même. Vérifier laisse le jeu la parcourir et compare."
"PhysFS lookups from listings" = "Recherches PhysFS depuis les listes"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "Démarrage : répond au second examen d'un dossier par le système de fichiers (le fichier existe-t-il, ouvrir un fichier absent) à partir des listes de répertoires des vérifications de chemins PhysFS (utilisées tant que verifypath_listing est activé). Les fichiers existants sont toujours ouverts par le jeu. Évite les ouvertures ratées qu'un gros ensemble de mods comme Anbennar fait dans chaque dossier qu'il remplace. Vérifier interroge le jeu à chaque fois et compte les différences."
"Checksum after the databases" = "Somme de contrôle après les bases de données"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "Chargement : la tâche de somme de contrôle du jeu ne commence à lire les fichiers qu'une fois les bases de données chargées, si bien qu'elle ne leur dispute plus le verrou du système de fichiers. Mêmes fichiers, même ordre et même somme affichée dans le menu ; environ 1 s de moins au démarrage d'un gros ensemble de mods comme Anbennar, rien de mesurable sur le jeu de base. Vérifier se contente de journaliser les temps de la tâche."
"Country range check" = "Vérification de portée des pays"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "Simulation, pas le démarrage : répond à la vérification de portée des pays à partir de la province qui était à portée la dernière fois ; mêmes réponses que le code du jeu."
"Simulation" = "Simulation"
"Modifier merge index" = "Index de fusion des modificateurs"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "Simulation : additionne les grandes listes de modificateurs (ceux de chaque pays à ceux de chaque unité lors de la mise à jour mensuelle) avec un index au lieu d'un parcours par entrée, si bien qu'une année en vitesse 5 passe environ 5 % plus vite ; mêmes entrées, même ordre, mêmes valeurs. Vérifier exécute la fusion du jeu et compare."
"Online service pacing" = "Cadence des services en ligne"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "Simulation : à la vitesse maximale, exécute les rappels des services en ligne Paradox du jeu toutes les 500 ms au lieu de deux fois par image. Quand il n'y a rien à livrer, chaque exécution fait dormir le thread principal 1 ms. Le multijoueur garde le rythme du jeu. Vérifier les exécute comme le jeu et compte ce qui serait omis."
"Province modifier view" = "Lecture directe des modificateurs de province"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "Simulation : lit une valeur des modificateurs d'une province sur place au lieu de copier d'abord toute la liste (dans la mise à jour quotidienne des pays et l'IA) ; même valeur. Vérifier exécute la copie du jeu et compare."
"Port table" = "Table des ports"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "Simulation : reconstruit la table du port le plus proche d'un pays à partir d'une seule liste de ses ports au lieu de parcourir à nouveau ses provinces et ses relations pour chaque province de la carte ; même table. Vérifier exécute la fonction du jeu et compare."
"AI army search memo" = "Mémo de la recherche d'armées de l'IA"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "Simulation : dans la recherche quotidienne de l'IA pour chaque armée, dans une recherche de chemin et lorsque les déplacements d'une unité depuis une province sont listés, détermine une seule fois si l'armée ignore les zones de contrôle des forts et quel est son modificateur de vitesse, au lieu de le faire pour chaque déplacement ; mêmes réponses. Vérifier exécute la vérification du jeu à chaque fois et compare."
"Frame pacing at speed 5" = "Cadence d'images en vitesse 5"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "Simulation : à la vitesse maximale, dessine moins souvent les images depuis l'intérieur du tick quotidien tant que vous ne faites rien (voir l'intervalle), si bien qu'une année passe environ 10 % plus vite ; une touche ou un clic obtient toujours une image aussitôt. La simulation est la même ; la carte se met à jour environ 16 fois par seconde au lieu de 22 en vitesse 5."
"Frame pacing interval (ms)" = "Intervalle de la cadence d'images (ms)"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "Temps minimal entre deux images dessinées dans le tick quotidien à la vitesse maximale (celui du jeu est de 50 ms ; une valeur plus courte garde celui du jeu). 0 garde l'intervalle du jeu et se contente de compter les images. S'applique aussitôt tant que la cadence d'images est activée."
"Frame pacing while you play" = "Cadence d'images pendant que vous jouez"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "Ce que fait la cadence d'images quand vous appuyez sur une touche, cliquez ou tournez la molette en vitesse 5 : dessiner une image aussitôt, pour que le jeu réagisse au moins aussi vite que sans cadence d'images (les images ne sont sautées que tant que vous ne faites rien), ou attendre l'intervalle plus long (0.12.0). S'applique aussitôt tant que la cadence d'images est activée."
"React at once" = "Réagir aussitôt"
"Wait for the interval" = "Attendre l'intervalle"
"Full speed while minimized" = "Pleine vitesse fenêtre réduite"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "Simulation : pendant qu'une partie solo tourne en vitesse 5, le jeu saute ses propres attentes allant jusqu'à 100 ms par image, qu'il fait lorsque la fenêtre est réduite. Une année fenêtre réduite prend alors environ 40 à 60 % de temps en moins ; avec la fenêtre visible, rien ne change. Utilise plus de temps processeur par seconde fenêtre réduite en vitesse 5. Les pauses, les menus, les autres vitesses et le multijoueur gardent les attentes du jeu."
"Save compression" = "Compression des sauvegardes"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "Sauvegarde : sauvegardes compressées (compress_autosave et autres) sans le CRC-32 octet par octet du jeu ; le fichier est identique octet pour octet à celui du jeu. Vérifier exécute aussi la compression du jeu, écrit son résultat et compare les deux."
"Saving" = "Sauvegarde"
"Parallel save compression" = "Compression parallèle des sauvegardes"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "Sauvegarde, avec la compression des sauvegardes activée : compresse sur plusieurs threads les gros fichiers d'une sauvegarde compressée (le gamestate). La sauvegarde est une archive valide que le jeu et les autres outils lisent comme avant, mais ses octets compressés diffèrent de ceux du jeu. Vérifier décode à nouveau chaque fichier avant de l'écrire."
"Skip transfer compression" = "Ignorer la compression de transfert"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "Chargement en solo : ne compresse pas une sauvegarde texte pour un transfert multijoueur que personne ne reçoit ; le jeu charge le même fichier qu'avant. Le multijoueur hébergé reste tel quel. Vérifier garde la copie du jeu et contrôle que rien ne la lit."
"Daily tick profile" = "Profil du tick quotidien"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "Diagnostic : durée de chaque étape du tick quotidien, mensuel et annuel et des images dessinées à l'intérieur, par jour de jeu, dans tick_profile*.tsv."
"Diagnostics" = "Diagnostic"
"AI army search profile" = "Profil de la recherche d'armées de l'IA"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Diagnostic : appels, durée et réponses répétées de la recherche d'armées de l'IA, dans army_search*.tsv."
"AI scoring probe" = "Sonde de notation de l'IA"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "Diagnostic : fréquence à laquelle les entrées des fonctions de notation de la recherche d'armées de l'IA se répètent au cours d'un jour de jeu, dans score_probe.tsv."
"Monthly tick probe" = "Sonde du tick mensuel"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "Diagnostic : durée des mises à jour des pays, des provinces et des unités du tick mensuel, des fusions de modificateurs et des tirages aléatoires, dans monthly_probe*.tsv."
"ZIP read profile" = "Profil des lectures ZIP"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "Diagnostic : temps passé dans les lectures ZIP et la décompression (inflate) par thread, dans anvil.log."
"Tokenizer lookup profile" = "Profil des recherches du tokeniseur"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "Diagnostic : les recherches de mots-clés du tokeniseur. Partage son point d'appel avec le cache des mots-clés du tokeniseur ; désactivez celui-ci pour des comptes exacts."
"Range check profile" = "Profil de la vérification de portée"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "Diagnostic : compteurs de la vérification de portée des pays dans range_profile*.tsv. Désactivez la vérification de portée des pays pour mesurer le parcours du jeu lui-même."
