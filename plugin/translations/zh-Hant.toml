# The plugin's texts in Traditional Chinese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "更快的《歐陸風雲 IV》啟動、模擬與存檔，不更動遊戲檔案或規則。"
"Faster memory allocator" = "更快的記憶體配置器"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "為遊戲提供更快的配置器（mimalloc），用到主選單為止或用於整個工作階段。"
"Start-up" = "啟動"
"File warm-up" = "預先開啟檔案"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "提前開啟遊戲需要的檔案。對電腦重新開機後的首次啟動幫助最大。"
"RAM prefetch" = "記憶體預讀"
"Unpacks the DLC archives the game needs into RAM in the background." = "在背景把遊戲需要的 DLC 壓縮檔解壓縮到記憶體中。"
"Path check cache" = "路徑檢查快取"
"Answers the game's file path checks from folder listings." = "根據資料夾列表回答遊戲的檔案路徑檢查。"
"Lookups from listings" = "根據列表查找"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "根據資料夾列表回答「此檔案是否在這裡」，適用於 Anbennar 這類大型模組組合。需要路徑檢查快取。"
"File existence index" = "檔案存在索引"
"Answers the modifier icons' \"does this file exist\" check faster." = "更快地回答修正圖示的「此檔案是否存在」檢查。"
"Trigger profile lookup" = "觸發器分析查找"
"Faster trigger lookups at the end of loading." = "在載入結束時更快地查找觸發器。"
"Parameter substitution" = "參數替換"
"Fills $parameters$ in scripted effects and triggers in one pass." = "在腳本效果與觸發器中一次填入 $parameters$。"
"Conditional blocks" = "條件區塊"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "一次解析 [[parameter]] 區塊。對含有大型腳本效果的模組提升明顯。"
"Missing-file cache" = "缺失檔案快取"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "在啟動期間記住缺失的檔案。提升很小，約 0.1 秒。"
"Keyword cache" = "關鍵字快取"
"Caches the script reader's keyword lookups." = "快取腳本讀取器的關鍵字查找。"
"Dated lists while loading" = "載入時的日期列表"
"Adds dated history entries without rescanning the list. Same list." = "加入帶日期的歷史項目時不再重新掃描列表。列表相同。"
"Loading" = "載入"
"Checksum after the databases" = "資料庫之後再計算校驗和"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "在資料庫載入完成後才開始遊戲的校驗和；大型模組組合的啟動快約 1 秒。"
"Path checks after start-up" = "啟動後的路徑檢查"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "主選單出現後仍保留路徑檢查快取，因此存檔載入快約 1.8 秒。需要路徑檢查快取。"
"Country range check" = "國家範圍檢查"
"Answers the country range check from the last province in range. Same answers." = "從上次位於範圍內的省份開始回答國家範圍檢查。結果相同。"
"Simulation" = "模擬"
"Frame pacing at speed 5" = "5 速時的影格節奏"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "你沒有操作時，在 5 速下繪製更少的影格；一年快約 10%。"
"Online service pacing" = "線上服務節流"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "在 5 速下降低 Paradox 線上服務檢查的頻率。多人遊戲中不使用。"
"Full speed while minimized" = "最小化時全速執行"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "遊戲最小化時仍讓 5 速全速執行。僅限單人遊戲；佔用更多 CPU。"
"Modifier merge index" = "修正合併索引"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "使用索引合併大型修正列表；5 速下一年快約 5%。"
"Port table" = "港口表"
"Builds each country's nearest-port table from its list of ports. Same table." = "根據每個國家的港口列表建立其最近港口表。表格相同。"
"Province modifier view" = "省份修正直讀"
"Reads province modifiers in place instead of copying them. Same values." = "直接讀取省份修正，而不是複製它們。數值相同。"
"AI army search memo" = "AI 軍隊搜尋快取"
"Remembers each army's facts in the AI's daily army search. Same answers." = "在 AI 每日的軍隊搜尋中記住每支軍隊的資訊。結果相同。"
"Save compression" = "存檔壓縮"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "更快地壓縮存檔。除非選擇多執行緒，檔案與遊戲產生的逐位元組相同。"
"Saving" = "存檔"
"Skip transfer compression" = "略過傳輸壓縮"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "在單人遊戲中，略過為無人接收的多人傳輸壓縮存檔。"
"Diagnostics" = "診斷"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "實驗工具：耗時分析以及與遊戲自身程式碼的對照檢查。會更慢；用於測試 Bellows。"
"For testing" = "測試用"
"Used for" = "使用範圍"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "到主選單為止（之後的配置重新使用 Windows 堆積）；或用於整個工作階段。"
"Until the main menu" = "到主選單為止"
"Whole session" = "整個工作階段"
"Memory budget (MB)" = "記憶體預算（MB）"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "用於存放已解壓縮但遊戲尚未取走的檔案的記憶體；每次啟動最多使用可用記憶體的四分之一。"
"Interval (ms)" = "間隔（ms）"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "你沒有操作時，5 速下影格之間的最短間隔（遊戲自身為 50 ms）；0 保持遊戲的間隔。"
"When you press a key or click" = "按鍵或點擊時"
"React at once draws a frame for every input; waiting skips more frames." = "立即回應會為每次輸入繪製一個影格；等待會跳過更多影格。"
"React at once" = "立即回應"
"Wait for the interval" = "等待間隔"
"Compress on several threads" = "多執行緒壓縮"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "對大型存檔更快；檔案是有效的存檔，但其位元組與遊戲產生的不同。"
"Daily tick profile" = "每日刻分析"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "每日、每月與每年刻各階段的耗時，寫入 tick_profile*.tsv。"
"Profiles" = "效能分析"
"AI army search profile" = "AI 軍隊搜尋分析"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "AI 軍隊搜尋的呼叫次數、耗時與重複結果，寫入 army_search*.tsv。"
"AI scoring probe" = "AI 評分探針"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "AI 軍隊搜尋的評分輸入在一天內重複的頻率，寫入 score_probe.tsv。"
"Monthly tick probe" = "每月刻探針"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "每月刻的更新、修正合併以及隨機抽取的耗時，寫入 monthly_probe*.tsv。"
"ZIP read profile" = "ZIP 讀取分析"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "每個執行緒在 ZIP 讀取與解壓縮（inflate）上花費的時間，寫入 anvil.log。"
"Keyword lookup profile" = "關鍵字查找分析"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "腳本讀取器的關鍵字查找；要得到準確的計數，請關閉關鍵字快取。"
"Range check profile" = "範圍檢查分析"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "國家範圍檢查的計數器，寫入 range_profile*.tsv；要測量遊戲自身的走訪，請關閉該模組。"
"Check: Path check cache" = "校驗：路徑檢查快取"
"Runs the game's own code as well and counts differences. Slower." = "同時執行遊戲自身的程式碼並統計差異。會更慢。"
"Check: Lookups from listings" = "校驗：根據列表查找"
"Check: File existence index" = "校驗：檔案存在索引"
"Check: Trigger profile lookup" = "校驗：觸發器分析查找"
"Check: Parameter substitution" = "校驗：參數替換"
"Check: Conditional blocks" = "校驗：條件區塊"
"Check: RAM prefetch" = "校驗：記憶體預讀"
"Check: Missing-file cache" = "校驗：缺失檔案快取"
"Check: Keyword cache" = "校驗：關鍵字快取"
"Check: Dated lists while loading" = "校驗：載入時的日期列表"
"Check: Checksum after the databases" = "校驗：資料庫之後再計算校驗和"
"Logs the checksum task's times." = "記錄校驗和工作的耗時。"
"Check: Country range check" = "校驗：國家範圍檢查"
"Check: Online service pacing" = "校驗：線上服務節流"
"Runs the callbacks as the game does and counts what pacing would leave out." = "依遊戲的方式執行回呼，並統計節流會省略的部分。"
"Check: Modifier merge index" = "校驗：修正合併索引"
"Check: Port table" = "校驗：港口表"
"Check: Province modifier view" = "校驗：省份修正直讀"
"Check: AI army search memo" = "校驗：AI 軍隊搜尋快取"
"Check: Save compression" = "校驗：存檔壓縮"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "同時依遊戲的方式壓縮並比較；使用多執行緒時重新解碼每個部分。"
"Check: Skip transfer compression" = "校驗：略過傳輸壓縮"
"Keeps the game's copy and checks that nothing reads it." = "保留遊戲的副本並檢查沒有任何地方讀取它。"
