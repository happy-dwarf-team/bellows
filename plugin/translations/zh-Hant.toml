# The plugin's texts in Traditional Chinese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "更快的《歐陸風雲 IV》啟動、模擬與存檔，不更動遊戲檔案或規則。"
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "為遊戲的 C 執行階段提供更快的記憶體配置器：用於整個遊戲工作階段，或僅到主選單為止（之後的配置使用 Windows 堆積）。"
"Start-up" = "啟動"
"On" = "開啟"
"Start-up only" = "僅啟動時"
"Off" = "關閉"
"PhysFS path checks" = "PhysFS 路徑檢查"
"Answers PhysFS path checks from directory listings." = "根據目錄列表回答 PhysFS 的路徑檢查。"
"Verify" = "校驗"
"File existence index" = "檔案存在索引"
"Answers \"does this file exist\" for the modifier icon check." = "為修正圖示檢查回答「此檔案是否存在」。"
"Trigger profile lookup" = "觸發器分析查找"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "在載入結束時，更快地在遊戲的觸發器分析表中查找每個觸發器。"
"Parameter substitution" = "參數替換"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "在腳本效果與觸發器中一次完成 $parameter$ 替換。"
"Conditional blocks" = "條件區塊"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "在腳本效果與觸發器中一次解析 [[parameter] ...] 區塊（對含有大型腳本效果的模組提升明顯，例如 Anbennar）。"
"Open warm-up" = "預先開啟檔案"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "在平行執行緒上提前開啟遊戲將要用到的檔案（用於電腦重新開機後的首次啟動）。"
"RAM prefetch" = "記憶體預讀"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "在工作執行緒上把遊戲將要用到的 DLC 壓縮檔成員讀入記憶體並解壓縮。"
"RAM prefetch budget (MB)" = "記憶體預讀預算（MB）"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "用於存放已解壓縮但遊戲尚未取走的壓縮檔成員的記憶體。每次啟動最多使用當時可用記憶體的四分之一。"
"Missing-file cache" = "缺失檔案快取"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "在啟動期間記住遊戲與模組檔案的「找不到檔案」結果（在其他模組之外最多節省約 0.1 秒）。"
"Tokenizer keyword cache" = "分詞器關鍵字快取"
"Caches the script tokenizer's keyword lookups." = "快取腳本分詞器的關鍵字查找。"
"PhysFS path checks after start-up" = "啟動後的 PhysFS 路徑檢查"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "載入：主選單出現後仍根據目錄列表回答 PhysFS 路徑檢查（在 verifypath_listing 開啟時使用），因此載入存檔時能提前約 1.8 秒找到其材質。列表超過 30 秒後會重新讀取。"
"Loading" = "載入"
"Dated lists while loading" = "載入時的日期列表"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "載入：把遊戲剛讀取的項目加入帶日期的列表時，不再先走訪整個列表查看新項目是否已在其中。得到的列表相同。校驗模式讓遊戲走訪並進行比較。"
"PhysFS lookups from listings" = "根據列表回答 PhysFS 查找"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "啟動：根據 PhysFS 路徑檢查的目錄列表（在 verifypath_listing 開啟時使用）回答檔案系統對資料夾的第二次查詢（檔案是否存在、開啟不存在的檔案）。已存在的檔案仍由遊戲開啟。可省去 Anbennar 這類大型模組組合在其覆蓋的每個資料夾中的失敗開啟操作。校驗模式每次都詢問遊戲並統計差異。"
"Checksum after the databases" = "資料庫之後再計算校驗和"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "載入：遊戲的校驗和工作在資料庫載入完成後才開始讀取檔案，因此不再與它們爭奪檔案系統鎖。檔案、順序與選單中顯示的校驗和都相同；Anbennar 這類大型模組組合的啟動快約 1 秒，原版遊戲沒有可測出的差別。校驗模式只記錄該工作的耗時。"
"Country range check" = "國家範圍檢查"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "模擬而非啟動：從上次位於範圍內的省份開始回答國家範圍檢查；結果與遊戲程式碼相同。"
"Simulation" = "模擬"
"Modifier merge index" = "修正合併索引"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "模擬：合併大型修正列表（每月更新中把每個國家的修正加到每支部隊上）時使用索引，而不是逐條掃描，因此 5 速下一年快約 5%；項目、順序與數值都相同。校驗模式執行遊戲自己的合併並比較。"
"Online service pacing" = "線上服務節流"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "模擬：在最快速度下，每 500 毫秒執行一次遊戲的 Paradox 線上服務回呼，而不是每影格兩次。沒有要傳遞的內容時，每次執行會讓主執行緒休眠 1 毫秒。多人遊戲保持遊戲自身的頻率。校驗模式依遊戲的方式執行它們並統計會被省略的部分。"
"Province modifier view" = "省份修正直讀"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "模擬：在每日國家更新與 AI 中，直接讀取省份修正中的一個值，而不是先複製整個列表；數值相同。校驗模式執行遊戲的複製並比較。"
"Port table" = "港口表"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "模擬：根據國家港口的單一列表重建其最近港口表，而不是為地圖上的每個省份重新走訪其省份與外交關係；表格相同。校驗模式執行遊戲的函式並比較。"
"AI army search memo" = "AI 軍隊搜尋快取"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "模擬：在 AI 每日為每支軍隊進行的搜尋、尋路以及列出部隊從某省份出發的移動時，只計算一次該軍隊是否無視要塞控制區以及其速度修正，而不是每次移動都計算；結果相同。校驗模式每次都執行遊戲的檢查並比較。"
"Frame pacing at speed 5" = "5 速時的影格節奏"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "模擬：在最快速度下，你沒有操作時，減少在每日刻內繪製影格的次數（見間隔），因此一年快約 10%；按鍵或點擊仍會立即得到一個影格。模擬相同；5 速時地圖每秒更新約 16 次而不是 22 次。"
"Frame pacing interval (ms)" = "影格節奏間隔（毫秒）"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "最快速度下在每日刻內繪製影格的最短間隔（遊戲自身為 50 毫秒；更短的值保持遊戲的間隔）。0 保持遊戲的間隔，只統計影格數。影格節奏開啟時立即生效。"
"Frame pacing while you play" = "操作時的影格節奏"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "在 5 速下按鍵、點擊或捲動滾輪時影格節奏的做法：立即繪製一個影格，使遊戲的回應至少與關閉影格節奏時一樣快（只在你沒有操作時跳過影格）；或等待較長的間隔（0.12.0 的做法）。影格節奏開啟時立即生效。"
"React at once" = "立即回應"
"Wait for the interval" = "等待間隔"
"Full speed while minimized" = "最小化時全速執行"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "模擬：單人遊戲以 5 速執行時，跳過遊戲在視窗最小化時每影格最多 100 毫秒的等待。最小化時一年所需時間因此減少約 40–60%；視窗可見時沒有變化。5 速最小化時每秒佔用更多處理器時間。暫停、選單、其他速度與多人遊戲保持遊戲的等待。"
"Save compression" = "存檔壓縮"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "存檔：壓縮存檔（compress_autosave 等）時不使用遊戲逐位元組計算的 CRC-32；檔案與遊戲產生的逐位元組相同。校驗模式同時執行遊戲自己的壓縮，寫入其結果並比較兩者。"
"Saving" = "存檔"
"Parallel save compression" = "平行存檔壓縮"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "存檔（需開啟存檔壓縮）：在多個執行緒上壓縮壓縮存檔中的大型成員（gamestate）。存檔是有效的壓縮檔，遊戲與其他工具都能照常讀取，但其壓縮位元組與遊戲產生的不同。校驗模式在寫入前重新解碼每個成員。"
"Skip transfer compression" = "略過傳輸壓縮"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "單人遊戲載入：不再為無人接收的多人傳輸壓縮文字存檔；遊戲載入的檔案與以前相同。作為主機的多人遊戲保持不變。校驗模式保留遊戲的副本並檢查沒有任何地方讀取它。"
"Daily tick profile" = "每日刻分析"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "診斷：每個遊戲日中每日、每月與每年刻的各階段以及其中繪製的影格的耗時，寫入 tick_profile*.tsv。"
"Diagnostics" = "診斷"
"AI army search profile" = "AI 軍隊搜尋分析"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "診斷：AI 軍隊搜尋的呼叫次數、耗時與重複結果，寫入 army_search*.tsv。"
"AI scoring probe" = "AI 評分探針"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "診斷：AI 軍隊搜尋的評分函式的輸入在一個遊戲日內重複的頻率，寫入 score_probe.tsv。"
"Monthly tick probe" = "每月刻探針"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "診斷：每月刻中國家、省份與部隊更新、修正合併以及隨機抽取的耗時，寫入 monthly_probe*.tsv。"
"ZIP read profile" = "ZIP 讀取分析"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "診斷：每個執行緒在 ZIP 讀取與解壓縮（inflate）上花費的時間，寫入 anvil.log。"
"Tokenizer lookup profile" = "分詞器查找分析"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "診斷：分詞器的關鍵字查找。與分詞器關鍵字快取共用呼叫點；要得到準確的計數，請關閉該快取。"
"Range check profile" = "範圍檢查分析"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "診斷：國家範圍檢查的計數器，寫入 range_profile*.tsv。要測量遊戲自身的走訪，請關閉國家範圍檢查。"
