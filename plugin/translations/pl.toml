# The plugin's texts in Polish: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Szybszy start, symulacja i zapisy w Europa Universalis IV, bez zmian w plikach i zasadach gry."
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "Szybszy alokator pamięci dla środowiska uruchomieniowego C gry: na całą sesję gry albo tylko do menu głównego (późniejsze alokacje używają sterty Windows)."
"Start-up" = "Uruchamianie"
"On" = "Włączone"
"Start-up only" = "Tylko przy starcie"
"Off" = "Wyłączone"
"PhysFS path checks" = "Sprawdzanie ścieżek PhysFS"
"Answers PhysFS path checks from directory listings." = "Odpowiada na sprawdzanie ścieżek PhysFS na podstawie list katalogów."
"Verify" = "Sprawdzaj"
"File existence index" = "Indeks istnienia plików"
"Answers \"does this file exist\" for the modifier icon check." = "Odpowiada na pytanie „czy ten plik istnieje” przy sprawdzaniu ikon modyfikatorów."
"Trigger profile lookup" = "Wyszukiwanie w profilu wyzwalaczy"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "Szybsze wyszukiwanie każdego wyzwalacza w profilu wyzwalaczy gry pod koniec wczytywania."
"Parameter substitution" = "Podstawianie parametrów"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "Podstawianie $parameter$ w jednym przebiegu w skryptowanych efektach i wyzwalaczach."
"Conditional blocks" = "Bloki warunkowe"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "Rozwiązywanie bloków [[parameter] ...] w jednym przebiegu w skryptowanych efektach i wyzwalaczach (duży zysk w modach z dużymi efektami skryptowymi, np. Anbennar)."
"Open warm-up" = "Wstępne otwieranie"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "Otwiera z wyprzedzeniem, w równoległych wątkach, pliki, których gra będzie potrzebować (z myślą o pierwszym starcie po ponownym uruchomieniu komputera)."
"RAM prefetch" = "Wstępne wczytywanie do RAM"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "Odczytuje i rozpakowuje do RAM, w wątkach roboczych, pliki z archiwów DLC, których gra będzie potrzebować."
"RAM prefetch budget (MB)" = "Budżet wstępnego wczytywania do RAM (MB)"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "RAM na rozpakowane pliki z archiwów, których gra jeszcze nie pobrała. Start używa najwyżej jednej czwartej pamięci wolnej w danej chwili."
"Missing-file cache" = "Pamięć podręczna brakujących plików"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "Zapamiętuje podczas startu odpowiedzi „nie znaleziono pliku” dla plików gry i modów (najwyżej ok. 0,1 s obok pozostałych modułów)."
"Tokenizer keyword cache" = "Pamięć podręczna słów kluczowych tokenizera"
"Caches the script tokenizer's keyword lookups." = "Zapamiętuje wyszukiwania słów kluczowych tokenizera skryptów."
"PhysFS path checks after start-up" = "Sprawdzanie ścieżek PhysFS po starcie"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "Wczytywanie: po pojawieniu się menu głównego nadal odpowiada na sprawdzanie ścieżek PhysFS z list katalogów (używanych, gdy verifypath_listing jest włączone), więc wczytanie zapisu znajduje jego tekstury ok. 1,8 s wcześniej. Lista jest odczytywana ponownie, gdy ma 30 s."
"Loading" = "Wczytywanie"
"Dated lists while loading" = "Listy z datami przy wczytywaniu"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "Wczytywanie: dodaje wpis, który gra właśnie odczytała, do listy z datami bez przechodzenia najpierw całej listy, aby sprawdzić, czy ten nowy wpis już w niej jest. Lista wychodzi taka sama. Sprawdzaj pozwala grze przejść listę i porównuje."
"PhysFS lookups from listings" = "Wyszukiwania PhysFS z list"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "Start: odpowiada na drugie zajrzenie systemu plików do folderu (czy plik istnieje, otwarcie pliku, którego nie ma) na podstawie list katalogów ze sprawdzania ścieżek PhysFS (używanych, gdy verifypath_listing jest włączone). Istniejące pliki nadal otwiera gra. Oszczędza nieudane otwarcia, które duży zestaw modów, taki jak Anbennar, wykonuje w każdym nadpisywanym folderze. Sprawdzaj pyta grę za każdym razem i liczy różnice."
"Checksum after the databases" = "Suma kontrolna po bazach danych"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "Wczytywanie: zadanie sumy kontrolnej gry zaczyna czytać pliki dopiero po wczytaniu baz danych, więc nie konkuruje już z nimi o blokadę systemu plików. Te same pliki, kolejność i suma kontrolna w menu; ok. 1 s mniej przy starcie dużego zestawu modów, takiego jak Anbennar, nic mierzalnego w podstawowej grze. Sprawdzaj tylko zapisuje w logu czasy zadania."
"Country range check" = "Sprawdzanie zasięgu państw"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "Symulacja, nie start: odpowiada na sprawdzanie zasięgu państw od prowincji, która ostatnio była w zasięgu; te same odpowiedzi co kod gry."
"Simulation" = "Symulacja"
"Modifier merge index" = "Indeks scalania modyfikatorów"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "Symulacja: łączy duże listy modyfikatorów (modyfikatory każdego państwa z modyfikatorami każdej jednostki w comiesięcznej aktualizacji) za pomocą indeksu zamiast przeszukiwania dla każdego wpisu, więc rok na prędkości 5 mija ok. 5% szybciej; te same wpisy, kolejność i wartości. Sprawdzaj uruchamia scalanie gry i porównuje."
"Online service pacing" = "Tempo usług online"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "Symulacja: na najwyższej prędkości wykonuje wywołania zwrotne usług online Paradoxu co 500 ms zamiast dwa razy na klatkę. Gdy nie ma nic do dostarczenia, każde wykonanie usypia wątek główny na 1 ms. Gra wieloosobowa zachowuje tempo gry. Sprawdzaj wykonuje je tak jak gra i liczy, co zostałoby pominięte."
"Province modifier view" = "Podgląd modyfikatorów prowincji"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "Symulacja: odczytuje jedną wartość z modyfikatorów prowincji na miejscu zamiast najpierw kopiować całą listę (w codziennej aktualizacji państw i w SI); ta sama wartość. Sprawdzaj wykonuje kopię gry i porównuje."
"Port table" = "Tabela portów"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "Symulacja: odbudowuje tabelę najbliższego portu państwa z jednej listy jego portów zamiast ponownie przechodzić jego prowincje i relacje dla każdej prowincji mapy; ta sama tabela. Sprawdzaj wykonuje funkcję gry i porównuje."
"AI army search memo" = "Pamięć wyszukiwania armii przez SI"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "Symulacja: w codziennym wyszukiwaniu SI dla każdej armii, w szukaniu ścieżki i przy wypisywaniu ruchów jednostki z prowincji ustala raz, czy armia ignoruje strefy kontroli fortów i jaki ma modyfikator prędkości, zamiast przy każdym ruchu; te same odpowiedzi. Sprawdzaj za każdym razem wykonuje sprawdzenie gry i porównuje."
"Frame pacing at speed 5" = "Tempo klatek na prędkości 5"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "Symulacja: na najwyższej prędkości rzadziej rysuje klatki z wnętrza dziennego ticku, gdy nic nie robisz (zob. odstęp), więc rok mija ok. 10% szybciej; naciśnięcie klawisza lub kliknięcie nadal od razu dostaje klatkę. Symulacja jest ta sama; na prędkości 5 mapa odświeża się ok. 16 zamiast 22 razy na sekundę."
"Frame pacing interval (ms)" = "Odstęp tempa klatek (ms)"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "Najkrótszy czas między klatkami rysowanymi wewnątrz dziennego ticku na najwyższej prędkości (w grze to 50 ms; krótsza wartość zostawia czas gry). 0 zostawia odstęp gry i tylko liczy klatki. Działa od razu, gdy tempo klatek jest włączone."
"Frame pacing while you play" = "Tempo klatek podczas gry"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "Co robi tempo klatek, gdy na prędkości 5 naciskasz klawisz, klikasz lub obracasz kółkiem: rysuje klatkę od razu, więc gra reaguje co najmniej tak szybko jak bez tempa klatek (klatki są pomijane tylko wtedy, gdy nic nie robisz), albo czeka na dłuższy odstęp (0.12.0). Działa od razu, gdy tempo klatek jest włączone."
"React at once" = "Reaguj od razu"
"Wait for the interval" = "Czekaj na odstęp"
"Full speed while minimized" = "Pełna prędkość po zminimalizowaniu"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "Symulacja: gdy gra jednoosobowa działa na prędkości 5, gra pomija własne oczekiwania do 100 ms na klatkę, które robi przy zminimalizowanym oknie. Rok przy zminimalizowanym oknie trwa wtedy ok. 40–60% krócej; przy widocznym oknie nic się nie zmienia. Zużywa więcej czasu procesora na sekundę przy zminimalizowanym oknie na prędkości 5. Pauzy, menu, inne prędkości i gra wieloosobowa zachowują oczekiwania gry."
"Save compression" = "Kompresja zapisów"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "Zapisywanie: skompresowane zapisy (compress_autosave i podobne) bez liczonego bajt po bajcie CRC-32 gry; plik jest bajt w bajt taki jak z gry. Sprawdzaj wykonuje też kompresję samej gry, zapisuje jej wynik i porównuje oba."
"Saving" = "Zapisywanie"
"Parallel save compression" = "Równoległa kompresja zapisów"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "Zapisywanie, przy włączonej kompresji zapisów: kompresuje duże pliki skompresowanego zapisu (gamestate) w kilku wątkach. Zapis jest poprawnym archiwum, które gra i inne narzędzia czytają jak dotąd, ale jego skompresowane bajty różnią się od tych z gry. Sprawdzaj przed zapisaniem dekoduje ponownie każdy plik."
"Skip transfer compression" = "Pomiń kompresję do przesyłu"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "Wczytywanie w grze jednoosobowej: nie kompresuje zapisu tekstowego do przesłania w grze wieloosobowej, którego nikt nie odbiera; gra wczytuje ten sam plik co wcześniej. Hostowana gra wieloosobowa zostaje bez zmian. Sprawdzaj zachowuje kopię gry i sprawdza, że nic jej nie czyta."
"Daily tick profile" = "Profil dziennego ticku"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "Diagnostyka: czas każdego etapu dziennego, miesięcznego i rocznego ticku oraz rysowanych w nim klatek, na każdy dzień gry, w tick_profile*.tsv."
"Diagnostics" = "Diagnostyka"
"AI army search profile" = "Profil wyszukiwania armii przez SI"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Diagnostyka: wywołania, czas i powtarzające się odpowiedzi wyszukiwania armii przez SI, w army_search*.tsv."
"AI scoring probe" = "Sonda ocen SI"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "Diagnostyka: jak często dane wejściowe funkcji oceniających wyszukiwania armii przez SI powtarzają się w ciągu dnia gry, w score_probe.tsv."
"Monthly tick probe" = "Sonda miesięcznego ticku"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "Diagnostyka: czas aktualizacji państw, prowincji i jednostek w miesięcznym ticku, scalania modyfikatorów i losowań, w monthly_probe*.tsv."
"ZIP read profile" = "Profil odczytów ZIP"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "Diagnostyka: czas spędzony na odczytach ZIP i dekompresji (inflate) w każdym wątku, w anvil.log."
"Tokenizer lookup profile" = "Profil wyszukiwań tokenizera"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "Diagnostyka: wyszukiwania słów kluczowych tokenizera. Dzieli miejsce wywołania z pamięcią podręczną słów kluczowych tokenizera; wyłącz ją, aby liczby były dokładne."
"Range check profile" = "Profil sprawdzania zasięgu"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "Diagnostyka: liczniki sprawdzania zasięgu państw w range_profile*.tsv. Wyłącz sprawdzanie zasięgu państw, aby zmierzyć przejście samej gry."
