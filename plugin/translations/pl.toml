# The plugin's texts in Polish: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Szybszy start, symulacja i zapisy w Europa Universalis IV, bez zmian w plikach i zasadach gry."
"Faster memory allocator" = "Szybszy alokator pamięci"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "Szybszy alokator (mimalloc) dla gry, do menu głównego albo na całą sesję."
"Start-up" = "Uruchamianie"
"File warm-up" = "Wstępne otwieranie plików"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "Otwiera z wyprzedzeniem pliki, których gra potrzebuje. Najbardziej pomaga przy pierwszym starcie po ponownym uruchomieniu komputera."
"RAM prefetch" = "Wstępne wczytywanie do RAM"
"Unpacks the DLC archives the game needs into RAM in the background." = "Rozpakowuje w tle do RAM archiwa DLC, których gra potrzebuje."
"Path check cache" = "Pamięć podręczna sprawdzania ścieżek"
"Answers the game's file path checks from folder listings." = "Odpowiada na sprawdzanie ścieżek plików przez grę na podstawie list folderów."
"Lookups from listings" = "Wyszukiwania z list"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "Odpowiada na pytanie „czy ten plik tu jest?” na podstawie list folderów, dla dużych zestawów modów, takich jak Anbennar. Wymaga pamięci podręcznej sprawdzania ścieżek."
"File existence index" = "Indeks istnienia plików"
"Answers the modifier icons' \"does this file exist\" check faster." = "Szybciej odpowiada na sprawdzanie „czy ten plik istnieje” przy ikonach modyfikatorów."
"Trigger profile lookup" = "Wyszukiwanie w profilu wyzwalaczy"
"Faster trigger lookups at the end of loading." = "Szybsze wyszukiwanie wyzwalaczy pod koniec wczytywania."
"Parameter substitution" = "Podstawianie parametrów"
"Fills $parameters$ in scripted effects and triggers in one pass." = "Wypełnia $parameters$ w skryptowanych efektach i wyzwalaczach w jednym przebiegu."
"Conditional blocks" = "Bloki warunkowe"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "Rozwiązuje bloki [[parameter]] w jednym przebiegu. Duży zysk w modach z dużymi efektami skryptowymi."
"Missing-file cache" = "Pamięć podręczna brakujących plików"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "Zapamiętuje brakujące pliki podczas startu. Mały zysk, ok. 0,1 s."
"Keyword cache" = "Pamięć podręczna słów kluczowych"
"Caches the script reader's keyword lookups." = "Zapamiętuje wyszukiwania słów kluczowych czytnika skryptów."
"Dated lists while loading" = "Listy z datami przy wczytywaniu"
"Adds dated history entries without rescanning the list. Same list." = "Dodaje wpisy historii z datami bez ponownego przeszukiwania listy. Ta sama lista."
"Loading" = "Wczytywanie"
"Checksum after the databases" = "Suma kontrolna po bazach danych"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "Uruchamia sumę kontrolną gry po wczytaniu baz danych; ok. 1 s mniej przy starcie dużego zestawu modów."
"Path checks after start-up" = "Sprawdzanie ścieżek po starcie"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "Zachowuje pamięć podręczną sprawdzania ścieżek po menu głównym, więc zapis wczytuje się ok. 1,8 s szybciej. Wymaga pamięci podręcznej sprawdzania ścieżek."
"Country range check" = "Sprawdzanie zasięgu państw"
"Answers the country range check from the last province in range. Same answers." = "Odpowiada na sprawdzanie zasięgu państw od ostatniej prowincji w zasięgu. Te same odpowiedzi."
"Simulation" = "Symulacja"
"Frame pacing at speed 5" = "Tempo klatek na prędkości 5"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "Rysuje mniej klatek na prędkości 5, gdy nic nie robisz; rok mija ok. 10% szybciej."
"Online service pacing" = "Tempo usług online"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "Rzadziej wykonuje sprawdzenia usług online Paradoxu na prędkości 5. Nie w grze wieloosobowej."
"Full speed while minimized" = "Pełna prędkość po zminimalizowaniu"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "Utrzymuje pełne tempo prędkości 5, gdy gra jest zminimalizowana. Gra jednoosobowa; zużywa więcej CPU."
"Modifier merge index" = "Indeks scalania modyfikatorów"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "Scala duże listy modyfikatorów za pomocą indeksu; rok na prędkości 5 mija ok. 5% szybciej."
"Port table" = "Tabela portów"
"Builds each country's nearest-port table from its list of ports. Same table." = "Buduje tabelę najbliższych portów każdego państwa z listy jego portów. Ta sama tabela."
"Province modifier view" = "Podgląd modyfikatorów prowincji"
"Reads province modifiers in place instead of copying them. Same values." = "Odczytuje modyfikatory prowincji na miejscu zamiast je kopiować. Te same wartości."
"AI army search memo" = "Pamięć wyszukiwania armii przez SI"
"Remembers each army's facts in the AI's daily army search. Same answers." = "Zapamiętuje dane każdej armii w codziennym wyszukiwaniu armii przez SI. Te same odpowiedzi."
"Save compression" = "Kompresja zapisów"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "Szybciej kompresuje zapisy. Plik jest bajt w bajt taki jak z gry, chyba że wybierzesz kilka wątków."
"Saving" = "Zapisywanie"
"Skip transfer compression" = "Pomiń kompresję do przesyłu"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "W grze jednoosobowej pomija kompresję zapisu do przesłania w grze wieloosobowej, którego nikt nie odbiera."
"Diagnostics" = "Diagnostyka"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "Narzędzia laboratoryjne: profile czasów i kontrole względem kodu samej gry. Wolniej; do testowania Bellows."
"For testing" = "Do testów"
"Used for" = "Zakres użycia"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "Do menu głównego, potem alokacje znów używają sterty Windows; albo na całą sesję."
"Until the main menu" = "Do menu głównego"
"Whole session" = "Cała sesja"
"Memory budget (MB)" = "Budżet pamięci (MB)"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "RAM na rozpakowane pliki, których gra jeszcze nie pobrała; start używa najwyżej jednej czwartej wolnej pamięci."
"Interval (ms)" = "Odstęp (ms)"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "Najkrótszy czas między klatkami na prędkości 5, gdy nic nie robisz (w grze to 50 ms); 0 zostawia czas gry."
"When you press a key or click" = "Gdy naciskasz klawisz lub klikasz"
"React at once draws a frame for every input; waiting skips more frames." = "Reaguj od razu rysuje klatkę przy każdym naciśnięciu lub kliknięciu; czekanie pomija więcej klatek."
"React at once" = "Reaguj od razu"
"Wait for the interval" = "Czekaj na odstęp"
"Compress on several threads" = "Kompresuj w kilku wątkach"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "Szybciej przy dużych zapisach; plik jest poprawnym zapisem, ale jego bajty różnią się od tych z gry."
"Daily tick profile" = "Profil dziennego ticku"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "Czas każdego etapu dziennego, miesięcznego i rocznego ticku, w tick_profile*.tsv."
"Profiles" = "Profile"
"AI army search profile" = "Profil wyszukiwania armii przez SI"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Wywołania, czas i powtarzające się odpowiedzi wyszukiwania armii przez SI, w army_search*.tsv."
"AI scoring probe" = "Sonda ocen SI"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "Jak często dane wejściowe ocen wyszukiwania armii przez SI powtarzają się w ciągu dnia, w score_probe.tsv."
"Monthly tick probe" = "Sonda miesięcznego ticku"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "Czas aktualizacji miesięcznego ticku, scalania modyfikatorów i losowań, w monthly_probe*.tsv."
"ZIP read profile" = "Profil odczytów ZIP"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "Czas spędzony na odczytach ZIP i dekompresji (inflate) w każdym wątku, w anvil.log."
"Keyword lookup profile" = "Profil wyszukiwań słów kluczowych"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "Wyszukiwania słów kluczowych czytnika skryptów; wyłącz pamięć podręczną słów kluczowych, aby liczby były dokładne."
"Range check profile" = "Profil sprawdzania zasięgu"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "Liczniki sprawdzania zasięgu państw, w range_profile*.tsv; wyłącz ten moduł, aby zmierzyć przejście samej gry."
"Check: Path check cache" = "Kontrola: Pamięć podręczna sprawdzania ścieżek"
"Runs the game's own code as well and counts differences. Slower." = "Wykonuje też kod samej gry i liczy różnice. Wolniej."
"Check: Lookups from listings" = "Kontrola: Wyszukiwania z list"
"Check: File existence index" = "Kontrola: Indeks istnienia plików"
"Check: Trigger profile lookup" = "Kontrola: Wyszukiwanie w profilu wyzwalaczy"
"Check: Parameter substitution" = "Kontrola: Podstawianie parametrów"
"Check: Conditional blocks" = "Kontrola: Bloki warunkowe"
"Check: RAM prefetch" = "Kontrola: Wstępne wczytywanie do RAM"
"Check: Missing-file cache" = "Kontrola: Pamięć podręczna brakujących plików"
"Check: Keyword cache" = "Kontrola: Pamięć podręczna słów kluczowych"
"Check: Dated lists while loading" = "Kontrola: Listy z datami przy wczytywaniu"
"Check: Checksum after the databases" = "Kontrola: Suma kontrolna po bazach danych"
"Logs the checksum task's times." = "Zapisuje w logu czasy zadania sumy kontrolnej."
"Check: Country range check" = "Kontrola: Sprawdzanie zasięgu państw"
"Check: Online service pacing" = "Kontrola: Tempo usług online"
"Runs the callbacks as the game does and counts what pacing would leave out." = "Wykonuje wywołania zwrotne tak jak gra i liczy, co tempo by pominęło."
"Check: Modifier merge index" = "Kontrola: Indeks scalania modyfikatorów"
"Check: Port table" = "Kontrola: Tabela portów"
"Check: Province modifier view" = "Kontrola: Podgląd modyfikatorów prowincji"
"Check: AI army search memo" = "Kontrola: Pamięć wyszukiwania armii przez SI"
"Check: Save compression" = "Kontrola: Kompresja zapisów"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "Kompresuje też tak jak gra i porównuje; przy kilku wątkach ponownie dekoduje każdą część."
"Check: Skip transfer compression" = "Kontrola: Pomiń kompresję do przesyłu"
"Keeps the game's copy and checks that nothing reads it." = "Zachowuje kopię gry i sprawdza, że nic jej nie czyta."
