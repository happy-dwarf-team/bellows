# The plugin's texts in Spanish: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Inicio, simulación y guardado más rápidos en Europa Universalis IV, sin cambiar los archivos ni las reglas del juego."
"Faster memory allocator" = "Asignador de memoria más rápido"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "Un asignador más rápido (mimalloc) para el juego, hasta el menú principal o durante toda la sesión."
"Start-up" = "Inicio"
"File warm-up" = "Apertura anticipada de archivos"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "Abre de antemano los archivos que el juego necesita. Ayuda sobre todo en el primer inicio tras reiniciar el equipo."
"RAM prefetch" = "Precarga en RAM"
"Unpacks the DLC archives the game needs into RAM in the background." = "Descomprime en RAM, en segundo plano, los paquetes de DLC que el juego necesita."
"Path check cache" = "Caché de comprobaciones de rutas"
"Answers the game's file path checks from folder listings." = "Responde a las comprobaciones de rutas de archivos del juego a partir de los listados de carpetas."
"Lookups from listings" = "Búsquedas desde los listados"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "Responde a «¿está aquí este archivo?» a partir de los listados de carpetas, para conjuntos grandes de mods como Anbennar. Necesita la caché de comprobaciones de rutas."
"File existence index" = "Índice de existencia de archivos"
"Answers the modifier icons' \"does this file exist\" check faster." = "Responde más rápido a la comprobación «¿existe este archivo?» de los iconos de modificadores."
"Trigger profile lookup" = "Búsqueda en el perfil de disparadores"
"Faster trigger lookups at the end of loading." = "Búsquedas de disparadores más rápidas al final de la carga."
"Parameter substitution" = "Sustitución de parámetros"
"Fills $parameters$ in scripted effects and triggers in one pass." = "Rellena los $parameters$ de los efectos y disparadores con script en una sola pasada."
"Conditional blocks" = "Bloques condicionales"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "Resuelve los bloques [[parameter]] en una sola pasada. Gran ganancia en mods con efectos con script grandes."
"Missing-file cache" = "Caché de archivos ausentes"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "Recuerda los archivos ausentes durante el inicio. Una ganancia pequeña, unos 0,1 s."
"Keyword cache" = "Caché de palabras clave"
"Caches the script reader's keyword lookups." = "Guarda en caché las búsquedas de palabras clave del lector de scripts."
"Dated lists while loading" = "Listas con fecha durante la carga"
"Adds dated history entries without rescanning the list. Same list." = "Añade entradas de historia con fecha sin volver a recorrer la lista. La misma lista."
"Loading" = "Carga"
"Checksum after the databases" = "Suma de comprobación tras las bases de datos"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "Inicia la suma de comprobación del juego tras cargar las bases de datos; cerca de 1 s menos al iniciar un conjunto grande de mods."
"Path checks after start-up" = "Comprobaciones de rutas tras el inicio"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "Mantiene la caché de comprobaciones de rutas después del menú principal, así que una partida carga unos 1,8 s antes. Necesita la caché de comprobaciones de rutas."
"Country range check" = "Comprobación de alcance de los países"
"Answers the country range check from the last province in range. Same answers." = "Responde a la comprobación de alcance de los países desde la última provincia al alcance. Mismas respuestas."
"Simulation" = "Simulación"
"Frame pacing at speed 5" = "Ritmo de fotogramas a velocidad 5"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "Dibuja menos fotogramas a velocidad 5 mientras no haces nada; un año pasa cerca de un 10 % antes."
"Online service pacing" = "Ritmo de los servicios en línea"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "Ejecuta con menos frecuencia las comprobaciones de los servicios en línea de Paradox a velocidad 5. No en multijugador."
"Full speed while minimized" = "Velocidad máxima con la ventana minimizada"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "Mantiene la velocidad 5 a pleno ritmo con el juego minimizado. Un jugador; usa más CPU."
"Modifier merge index" = "Índice de combinación de modificadores"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "Combina las listas grandes de modificadores con un índice; un año a velocidad 5 pasa cerca de un 5 % antes."
"Port table" = "Tabla de puertos"
"Builds each country's nearest-port table from its list of ports. Same table." = "Construye la tabla de puertos más cercanos de cada país a partir de su lista de puertos. La misma tabla."
"Province modifier view" = "Vista directa de los modificadores de provincia"
"Reads province modifiers in place instead of copying them. Same values." = "Lee los modificadores de provincia en el sitio en lugar de copiarlos. Mismos valores."
"AI army search memo" = "Memoria de la búsqueda de ejércitos de la IA"
"Remembers each army's facts in the AI's daily army search. Same answers." = "Recuerda los datos de cada ejército en la búsqueda diaria de ejércitos de la IA. Mismas respuestas."
"Save compression" = "Compresión de partidas guardadas"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "Comprime las partidas guardadas más rápido. El archivo es byte a byte el del juego, salvo que elijas varios hilos."
"Saving" = "Guardado"
"Skip transfer compression" = "Omitir la compresión de transferencia"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "En un jugador, omite comprimir una partida para una transferencia multijugador que nadie recibe."
"Diagnostics" = "Diagnóstico"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "Herramientas de laboratorio: perfiles de tiempos y comprobaciones frente al código del propio juego. Más lento; para probar Bellows."
"For testing" = "Para pruebas"
"Used for" = "Uso"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "Hasta el menú principal, y después las asignaciones vuelven a usar el montón de Windows; o durante toda la sesión."
"Until the main menu" = "Hasta el menú principal"
"Whole session" = "Toda la sesión"
"Memory budget (MB)" = "Presupuesto de memoria (MB)"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "RAM para los archivos descomprimidos que el juego aún no ha recogido; un inicio usa como máximo una cuarta parte de la memoria libre."
"Interval (ms)" = "Intervalo (ms)"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "Tiempo mínimo entre fotogramas a velocidad 5 mientras no haces nada (el del juego es 50 ms); 0 mantiene el del juego."
"When you press a key or click" = "Al pulsar una tecla o hacer clic"
"React at once draws a frame for every input; waiting skips more frames." = "Reaccionar al instante dibuja un fotograma por cada entrada; esperar se salta más fotogramas."
"React at once" = "Reaccionar al instante"
"Wait for the interval" = "Esperar al intervalo"
"Compress on several threads" = "Comprimir en varios hilos"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "Más rápido con partidas grandes; el archivo es una partida válida, pero sus bytes son distintos de los del juego."
"Daily tick profile" = "Perfil del tick diario"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "Tiempo de cada etapa del tick diario, mensual y anual, en tick_profile*.tsv."
"Profiles" = "Perfiles"
"AI army search profile" = "Perfil de la búsqueda de ejércitos de la IA"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Llamadas, tiempo y respuestas repetidas de la búsqueda de ejércitos de la IA, en army_search*.tsv."
"AI scoring probe" = "Sonda de puntuación de la IA"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "Con qué frecuencia se repiten en un día las entradas de puntuación de la búsqueda de ejércitos de la IA, en score_probe.tsv."
"Monthly tick probe" = "Sonda del tick mensual"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "Tiempo de las actualizaciones del tick mensual, de las combinaciones de modificadores y de las tiradas aleatorias, en monthly_probe*.tsv."
"ZIP read profile" = "Perfil de lecturas ZIP"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "Tiempo dedicado a lecturas ZIP y a la descompresión (inflate) por hilo, en anvil.log."
"Keyword lookup profile" = "Perfil de búsquedas de palabras clave"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "Las búsquedas de palabras clave del lector de scripts; desactiva la caché de palabras clave para obtener recuentos limpios."
"Range check profile" = "Perfil de la comprobación de alcance"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "Contadores de la comprobación de alcance de los países, en range_profile*.tsv; desactiva ese módulo para medir el recorrido del juego."
"Check: Path check cache" = "Verificación: Caché de comprobaciones de rutas"
"Runs the game's own code as well and counts differences. Slower." = "Ejecuta también el código del propio juego y cuenta las diferencias. Más lento."
"Check: Lookups from listings" = "Verificación: Búsquedas desde los listados"
"Check: File existence index" = "Verificación: Índice de existencia de archivos"
"Check: Trigger profile lookup" = "Verificación: Búsqueda en el perfil de disparadores"
"Check: Parameter substitution" = "Verificación: Sustitución de parámetros"
"Check: Conditional blocks" = "Verificación: Bloques condicionales"
"Check: RAM prefetch" = "Verificación: Precarga en RAM"
"Check: Missing-file cache" = "Verificación: Caché de archivos ausentes"
"Check: Keyword cache" = "Verificación: Caché de palabras clave"
"Check: Dated lists while loading" = "Verificación: Listas con fecha durante la carga"
"Check: Checksum after the databases" = "Verificación: Suma de comprobación tras las bases de datos"
"Logs the checksum task's times." = "Registra los tiempos de la tarea de suma de comprobación."
"Check: Country range check" = "Verificación: Comprobación de alcance de los países"
"Check: Online service pacing" = "Verificación: Ritmo de los servicios en línea"
"Runs the callbacks as the game does and counts what pacing would leave out." = "Ejecuta las llamadas como el juego y cuenta lo que el ritmo dejaría fuera."
"Check: Modifier merge index" = "Verificación: Índice de combinación de modificadores"
"Check: Port table" = "Verificación: Tabla de puertos"
"Check: Province modifier view" = "Verificación: Vista directa de los modificadores de provincia"
"Check: AI army search memo" = "Verificación: Memoria de la búsqueda de ejércitos de la IA"
"Check: Save compression" = "Verificación: Compresión de partidas guardadas"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "Comprime también como el juego y compara; con varios hilos, vuelve a descodificar cada parte."
"Check: Skip transfer compression" = "Verificación: Omitir la compresión de transferencia"
"Keeps the game's copy and checks that nothing reads it." = "Conserva la copia del juego y comprueba que nada la lee."
