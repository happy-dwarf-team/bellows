# The plugin's texts in Spanish: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Inicio, simulación y guardado más rápidos en Europa Universalis IV, sin cambiar los archivos ni las reglas del juego."
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "Asignador de memoria más rápido para el runtime de C del juego: durante toda la sesión de juego, o solo hasta el menú principal (las asignaciones posteriores usan el montón de Windows)."
"Start-up" = "Inicio"
"On" = "Activado"
"Start-up only" = "Solo al iniciar"
"Off" = "Desactivado"
"PhysFS path checks" = "Comprobaciones de rutas de PhysFS"
"Answers PhysFS path checks from directory listings." = "Responde a las comprobaciones de rutas de PhysFS a partir de los listados de directorios."
"Verify" = "Verificar"
"File existence index" = "Índice de existencia de archivos"
"Answers \"does this file exist\" for the modifier icon check." = "Responde a «¿existe este archivo?» para la comprobación de los iconos de modificadores."
"Trigger profile lookup" = "Búsqueda en el perfil de disparadores"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "Búsqueda más rápida de cada disparador en el perfil de disparadores del juego al final de la carga."
"Parameter substitution" = "Sustitución de parámetros"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "Sustitución de $parameter$ en una sola pasada en los efectos y disparadores con script."
"Conditional blocks" = "Bloques condicionales"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "Resolución en una sola pasada de los bloques [[parameter] ...] en los efectos y disparadores con script (gran ganancia en mods con efectos con script grandes, p. ej. Anbennar)."
"Open warm-up" = "Apertura anticipada"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "Abre de antemano, en hilos paralelos, los archivos que el juego va a necesitar (pensado para el primer inicio tras reiniciar el equipo)."
"RAM prefetch" = "Precarga en RAM"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "Lee y descomprime en RAM, en hilos de trabajo, los archivos de los paquetes de DLC que el juego va a necesitar."
"RAM prefetch budget (MB)" = "Presupuesto de la precarga en RAM (MB)"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "RAM para los archivos de paquete descomprimidos que el juego aún no ha recogido. Un inicio usa como máximo una cuarta parte de la memoria libre en ese momento."
"Missing-file cache" = "Caché de archivos ausentes"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "Recuerda durante el inicio las respuestas «archivo no encontrado» para los archivos del juego y de los mods (como mucho ~0,1 s además de los otros módulos)."
"Tokenizer keyword cache" = "Caché de palabras clave del tokenizador"
"Caches the script tokenizer's keyword lookups." = "Guarda en caché las búsquedas de palabras clave del tokenizador de scripts."
"PhysFS path checks after start-up" = "Comprobaciones de rutas de PhysFS tras el inicio"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "Carga: sigue respondiendo a las comprobaciones de rutas de PhysFS con los listados de directorios después de que aparezca el menú principal (se usa mientras verifypath_listing está activado), así que al cargar una partida sus texturas se encuentran unos 1,8 s antes. Un listado se vuelve a leer cuando tiene 30 s."
"Loading" = "Carga"
"Dated lists while loading" = "Listas con fecha durante la carga"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "Carga: añade una entrada que el juego acaba de leer a una lista con fecha sin recorrer antes toda la lista para ver si esa nueva entrada ya está en ella. La lista queda igual. Verificar deja que el juego la recorra y compara."
"PhysFS lookups from listings" = "Búsquedas de PhysFS desde los listados"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "Inicio: responde a la segunda consulta del sistema de archivos sobre una carpeta (si existe el archivo, abrir un archivo que no está) a partir de los listados de directorios de las comprobaciones de rutas de PhysFS (se usan mientras verifypath_listing está activado). Los archivos que existen los sigue abriendo el juego. Ahorra las aperturas fallidas que un conjunto grande de mods como Anbennar hace en cada carpeta que sustituye. Verificar pregunta al juego cada vez y cuenta las diferencias."
"Checksum after the databases" = "Suma de comprobación tras las bases de datos"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "Carga: la tarea de suma de comprobación del juego solo empieza a leer archivos cuando las bases de datos ya están cargadas, así que deja de competir con ellas por el bloqueo del sistema de archivos. Mismos archivos, mismo orden y misma suma en el menú; cerca de 1 s menos al iniciar un conjunto grande de mods como Anbennar, nada medible en el juego base. Verificar solo registra los tiempos de la tarea."
"Country range check" = "Comprobación de alcance de los países"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "Simulación, no el inicio: responde a la comprobación de alcance de los países desde la provincia que estuvo al alcance la última vez; mismas respuestas que el código del juego."
"Simulation" = "Simulación"
"Modifier merge index" = "Índice de combinación de modificadores"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "Simulación: suma las listas grandes de modificadores (los de cada país a los de cada unidad en la actualización mensual) con un índice en lugar de un recorrido por entrada, así que un año a velocidad 5 pasa cerca de un 5 % antes; mismas entradas, orden y valores. Verificar ejecuta la combinación del juego y compara."
"Online service pacing" = "Ritmo de los servicios en línea"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "Simulación: a la velocidad máxima, ejecuta las llamadas de los servicios en línea de Paradox del juego cada 500 ms en lugar de dos veces por fotograma. Si no hay nada que entregar, cada ejecución hace dormir al hilo principal 1 ms. El multijugador mantiene el ritmo del juego. Verificar las ejecuta como el juego y cuenta lo que se dejaría fuera."
"Province modifier view" = "Vista directa de los modificadores de provincia"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "Simulación: lee un valor de los modificadores de una provincia en el sitio en lugar de copiar antes toda la lista (en la actualización diaria de los países y en la IA); el mismo valor. Verificar ejecuta la copia del juego y compara."
"Port table" = "Tabla de puertos"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "Simulación: reconstruye la tabla del puerto más cercano de un país a partir de una sola lista de sus puertos en lugar de recorrer otra vez sus provincias y relaciones para cada provincia del mapa; la misma tabla. Verificar ejecuta la función del juego y compara."
"AI army search memo" = "Memoria de la búsqueda de ejércitos de la IA"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "Simulación: en la búsqueda diaria de la IA para cada ejército, en una búsqueda de ruta y al listar los movimientos de una unidad desde una provincia, calcula una sola vez si el ejército ignora las zonas de control de los fuertes y cuál es su modificador de velocidad, en lugar de hacerlo en cada movimiento; mismas respuestas. Verificar ejecuta la comprobación del juego cada vez y compara."
"Frame pacing at speed 5" = "Ritmo de fotogramas a velocidad 5"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "Simulación: a la velocidad máxima, dibuja con menos frecuencia los fotogramas desde dentro del tick diario mientras no haces nada (ver el intervalo), así que un año pasa cerca de un 10 % antes; una tecla o un clic sigue recibiendo un fotograma al instante. La simulación es la misma; el mapa se actualiza unas 16 veces por segundo en lugar de 22 a velocidad 5."
"Frame pacing interval (ms)" = "Intervalo del ritmo de fotogramas (ms)"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "Tiempo mínimo entre fotogramas dibujados dentro del tick diario a la velocidad máxima (el del juego es 50 ms; un valor menor mantiene el del juego). 0 mantiene el intervalo del juego y solo cuenta fotogramas. Se aplica al instante mientras el ritmo de fotogramas está activado."
"Frame pacing while you play" = "Ritmo de fotogramas mientras juegas"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "Lo que hace el ritmo de fotogramas cuando pulsas una tecla, haces clic o giras la rueda a velocidad 5: dibujar un fotograma al instante, para que el juego reaccione al menos tan rápido como sin ritmo de fotogramas (solo se saltan fotogramas mientras no haces nada), o esperar al intervalo más largo (0.12.0). Se aplica al instante mientras el ritmo de fotogramas está activado."
"React at once" = "Reaccionar al instante"
"Wait for the interval" = "Esperar al intervalo"
"Full speed while minimized" = "Velocidad máxima con la ventana minimizada"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "Simulación: mientras una partida de un jugador va a velocidad 5, el juego se salta sus propias esperas de hasta 100 ms por fotograma, que hace cuando la ventana está minimizada. Un año con la ventana minimizada tarda entonces entre un 40 y un 60 % menos; con la ventana visible no cambia nada. Usa más tiempo de procesador por segundo con la ventana minimizada a velocidad 5. Las pausas, los menús, las otras velocidades y el multijugador mantienen las esperas del juego."
"Save compression" = "Compresión de partidas guardadas"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "Guardado: partidas guardadas comprimidas (compress_autosave y similares) sin el CRC-32 byte a byte del juego; el archivo es byte a byte el del juego. Verificar ejecuta también la compresión del propio juego, escribe su resultado y compara los dos."
"Saving" = "Guardado"
"Parallel save compression" = "Compresión paralela de partidas guardadas"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "Guardado, con la compresión de partidas activada: comprime en varios hilos los archivos grandes de una partida guardada comprimida (el gamestate). La partida es un archivo comprimido válido que el juego y otras herramientas leen como antes, pero sus bytes comprimidos son distintos de los del juego. Verificar vuelve a descodificar cada archivo antes de escribirlo."
"Skip transfer compression" = "Omitir la compresión de transferencia"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "Carga en un jugador: no comprime una partida de texto para una transferencia multijugador que nadie recibe; el juego carga el mismo archivo que antes. El multijugador alojado se queda como está. Verificar conserva la copia del juego y comprueba que nada la lee."
"Daily tick profile" = "Perfil del tick diario"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "Diagnóstico: tiempo de cada etapa del tick diario, mensual y anual y de los fotogramas dibujados dentro de él, por día de juego, en tick_profile*.tsv."
"Diagnostics" = "Diagnóstico"
"AI army search profile" = "Perfil de la búsqueda de ejércitos de la IA"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "Diagnóstico: llamadas, tiempo y respuestas repetidas de la búsqueda de ejércitos de la IA, en army_search*.tsv."
"AI scoring probe" = "Sonda de puntuación de la IA"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "Diagnóstico: con qué frecuencia se repiten dentro de un día de juego las entradas de las funciones de puntuación de la búsqueda de ejércitos de la IA, en score_probe.tsv."
"Monthly tick probe" = "Sonda del tick mensual"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "Diagnóstico: tiempo de las actualizaciones de países, provincias y unidades del tick mensual, de las combinaciones de modificadores y de las tiradas aleatorias, en monthly_probe*.tsv."
"ZIP read profile" = "Perfil de lecturas ZIP"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "Diagnóstico: tiempo dedicado a lecturas ZIP y a la descompresión (inflate) por hilo, en anvil.log."
"Tokenizer lookup profile" = "Perfil de búsquedas del tokenizador"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "Diagnóstico: las búsquedas de palabras clave del tokenizador. Comparte su punto de llamada con la caché de palabras clave del tokenizador; desactívala para obtener recuentos limpios."
"Range check profile" = "Perfil de la comprobación de alcance"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "Diagnóstico: contadores de la comprobación de alcance de los países en range_profile*.tsv. Desactiva la comprobación de alcance de los países para medir el recorrido del propio juego."
