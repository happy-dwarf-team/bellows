# The plugin's texts in Korean: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Europa Universalis IV의 시작, 시뮬레이션, 저장을 더 빠르게 합니다. 게임 파일이나 규칙은 바꾸지 않습니다."
"Faster memory allocator" = "더 빠른 메모리 할당자"
"A faster allocator (mimalloc) for the game, until the main menu or for the whole session." = "게임을 위한 더 빠른 할당자(mimalloc)입니다. 메인 메뉴까지 또는 세션 전체에 씁니다."
"Start-up" = "시작"
"File warm-up" = "파일 미리 열기"
"Opens the files the game needs ahead of it. Helps most on the first start after a reboot." = "게임에 필요한 파일을 미리 엽니다. 컴퓨터를 다시 시작한 뒤 첫 실행에서 가장 효과가 큽니다."
"RAM prefetch" = "RAM 미리 읽기"
"Unpacks the DLC archives the game needs into RAM in the background." = "게임에 필요한 DLC 압축 파일을 백그라운드에서 RAM으로 풉니다."
"Path check cache" = "경로 확인 캐시"
"Answers the game's file path checks from folder listings." = "게임의 파일 경로 확인에 폴더 목록으로 답합니다."
"Lookups from listings" = "목록으로 조회"
"Answers \"is this file here?\" from folder listings, for big mod sets such as Anbennar. Needs Path check cache." = "'이 파일이 여기 있는가'에 폴더 목록으로 답합니다. Anbennar 같은 큰 모드 구성용입니다. 경로 확인 캐시가 필요합니다."
"File existence index" = "파일 존재 색인"
"Answers the modifier icons' \"does this file exist\" check faster." = "수정자 아이콘의 '이 파일이 있는가' 확인에 더 빠르게 답합니다."
"Trigger profile lookup" = "트리거 프로필 조회"
"Faster trigger lookups at the end of loading." = "불러오기가 끝날 때 트리거를 더 빠르게 찾습니다."
"Parameter substitution" = "매개변수 치환"
"Fills $parameters$ in scripted effects and triggers in one pass." = "스크립트 효과와 트리거의 $parameters$를 한 번에 채웁니다."
"Conditional blocks" = "조건 블록"
"Resolves [[parameter]] blocks in one pass. Big gain on mods with large scripted effects." = "[[parameter]] 블록을 한 번에 처리합니다. 큰 스크립트 효과가 있는 모드에서 효과가 큽니다."
"Missing-file cache" = "없는 파일 캐시"
"Remembers missing files during start-up. A small gain, about 0.1 s." = "시작하는 동안 없는 파일을 기억합니다. 효과는 작아서 약 0.1초입니다."
"Keyword cache" = "키워드 캐시"
"Caches the script reader's keyword lookups." = "스크립트 리더의 키워드 조회를 캐시합니다."
"Dated lists while loading" = "불러오는 동안 날짜 목록"
"Adds dated history entries without rescanning the list. Same list." = "날짜가 있는 역사 항목을 목록을 다시 훑지 않고 추가합니다. 목록은 같습니다."
"Loading" = "불러오기"
"Checksum after the databases" = "데이터베이스 다음에 체크섬"
"Starts the game's checksum after the databases load; about 1 s off a big mod set's start." = "데이터베이스를 불러온 뒤에 게임의 체크섬을 시작합니다. 큰 모드 구성에서는 시작이 약 1초 빨라집니다."
"Path checks after start-up" = "시작 후 경로 확인"
"Keeps the path check cache after the main menu, so a save loads about 1.8 s sooner. Needs Path check cache." = "메인 메뉴 뒤에도 경로 확인 캐시를 유지해 세이브를 약 1.8초 빨리 불러옵니다. 경로 확인 캐시가 필요합니다."
"Country range check" = "국가 범위 확인"
"Answers the country range check from the last province in range. Same answers." = "국가 범위 확인에 마지막으로 범위 안에 있던 프로빈스부터 답합니다. 답은 같습니다."
"Simulation" = "시뮬레이션"
"Frame pacing at speed 5" = "속도 5에서 프레임 조절"
"Draws fewer frames at speed 5 while you do nothing; a year passes about 10% sooner." = "아무것도 하지 않는 동안 속도 5에서 프레임을 덜 그립니다. 1년이 약 10% 빨리 지나갑니다."
"Online service pacing" = "온라인 서비스 주기 조절"
"Runs the Paradox online-service checks less often at speed 5. Not in multiplayer." = "속도 5에서 Paradox 온라인 서비스 확인을 덜 자주 실행합니다. 멀티플레이에서는 쓰지 않습니다."
"Full speed while minimized" = "최소화 중에도 최고 속도"
"Keeps speed 5 at full pace while the game is minimized. Single player; uses more CPU." = "게임이 최소화된 동안에도 속도 5를 최고 속도로 유지합니다. 싱글플레이 전용이며 CPU를 더 씁니다."
"Modifier merge index" = "수정자 병합 색인"
"Merges large modifier lists with an index; a year at speed 5 passes about 5% sooner." = "큰 수정자 목록을 색인으로 병합합니다. 속도 5에서 1년이 약 5% 빨리 지나갑니다."
"Port table" = "항구 표"
"Builds each country's nearest-port table from its list of ports. Same table." = "각 국가의 가장 가까운 항구 표를 그 나라 항구 목록으로 만듭니다. 표는 같습니다."
"Province modifier view" = "프로빈스 수정자 직접 읽기"
"Reads province modifiers in place instead of copying them. Same values." = "프로빈스 수정자를 복사하지 않고 그 자리에서 읽습니다. 값은 같습니다."
"AI army search memo" = "AI 군대 탐색 메모"
"Remembers each army's facts in the AI's daily army search. Same answers." = "AI의 일일 군대 탐색에서 각 군대의 정보를 기억합니다. 답은 같습니다."
"Save compression" = "세이브 압축"
"Compresses saves faster. The file is the game's, byte for byte, unless you choose several threads." = "세이브를 더 빠르게 압축합니다. 여러 스레드를 고르지 않으면 파일은 게임의 것과 바이트 단위로 같습니다."
"Saving" = "저장"
"Skip transfer compression" = "전송 압축 건너뛰기"
"In single player, skips compressing a save for a multiplayer transfer nobody receives." = "싱글플레이에서 아무도 받지 않는 멀티플레이 전송을 위한 세이브 압축을 건너뜁니다."
"Diagnostics" = "진단"
"Lab tools: timing profiles and checks against the game's own code. Slower; for testing Bellows." = "실험용 도구: 시간 프로필과 게임 자체 코드와의 비교 확인입니다. 느려지며 Bellows 테스트용입니다."
"For testing" = "테스트용"
"Used for" = "사용 범위"
"Until the main menu, later allocations use the Windows heap again; or for the whole session." = "메인 메뉴까지(그 뒤의 할당은 다시 Windows 힙을 씁니다) 또는 세션 전체에 씁니다."
"Until the main menu" = "메인 메뉴까지"
"Whole session" = "세션 전체"
"Memory budget (MB)" = "메모리 한도(MB)"
"RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory." = "풀었지만 게임이 아직 가져가지 않은 파일에 쓰는 RAM입니다. 한 번의 시작에는 남은 메모리의 4분의 1까지만 씁니다."
"Interval (ms)" = "간격(ms)"
"Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's." = "아무것도 하지 않는 동안 속도 5에서 프레임 사이의 최소 시간입니다(게임 자체는 50ms). 0은 게임의 간격을 유지합니다."
"When you press a key or click" = "키를 누르거나 클릭할 때"
"React at once draws a frame for every input; waiting skips more frames." = "바로 반응은 입력마다 프레임을 그리고, 기다리기는 프레임을 더 많이 건너뜁니다."
"React at once" = "바로 반응"
"Wait for the interval" = "간격까지 기다리기"
"Compress on several threads" = "여러 스레드에서 압축"
"Faster for large saves; the file is a valid save, but its bytes differ from the game's." = "큰 세이브에서 더 빠릅니다. 파일은 올바른 세이브이지만 바이트는 게임의 것과 다릅니다."
"Daily tick profile" = "일일 틱 프로필"
"Time of each stage of the daily, monthly and yearly tick, in tick_profile*.tsv." = "일일, 월간, 연간 틱의 각 단계 시간을 tick_profile*.tsv에 기록합니다."
"Profiles" = "프로필"
"AI army search profile" = "AI 군대 탐색 프로필"
"Calls, time and repeated answers of the AI army search, in army_search*.tsv." = "AI 군대 탐색의 호출, 시간, 반복된 답을 army_search*.tsv에 기록합니다."
"AI scoring probe" = "AI 점수 계산 측정"
"How often the AI army search's scoring inputs repeat within a day, in score_probe.tsv." = "AI 군대 탐색의 점수 입력이 하루 안에 얼마나 자주 반복되는지 score_probe.tsv에 기록합니다."
"Monthly tick probe" = "월간 틱 측정"
"Time of the monthly tick's updates, modifier merges and random draws, in monthly_probe*.tsv." = "월간 틱의 갱신, 수정자 병합, 난수 추첨의 시간을 monthly_probe*.tsv에 기록합니다."
"ZIP read profile" = "ZIP 읽기 프로필"
"Time spent in ZIP reads and inflate per thread, in anvil.log." = "스레드마다 ZIP 읽기와 압축 풀기(inflate)에 쓴 시간을 anvil.log에 기록합니다."
"Keyword lookup profile" = "키워드 조회 프로필"
"The script reader's keyword lookups; turn the keyword cache off for clean counts." = "스크립트 리더의 키워드 조회입니다. 정확한 횟수를 보려면 키워드 캐시를 끄세요."
"Range check profile" = "범위 확인 프로필"
"Counters of the country range check, in range_profile*.tsv; turn that module off for the game's walk." = "국가 범위 확인의 카운터를 range_profile*.tsv에 기록합니다. 게임의 탐색을 보려면 그 모듈을 끄세요."
"Check: Path check cache" = "검증: 경로 확인 캐시"
"Runs the game's own code as well and counts differences. Slower." = "게임 자체 코드도 실행하고 차이를 셉니다. 느려집니다."
"Check: Lookups from listings" = "검증: 목록으로 조회"
"Check: File existence index" = "검증: 파일 존재 색인"
"Check: Trigger profile lookup" = "검증: 트리거 프로필 조회"
"Check: Parameter substitution" = "검증: 매개변수 치환"
"Check: Conditional blocks" = "검증: 조건 블록"
"Check: RAM prefetch" = "검증: RAM 미리 읽기"
"Check: Missing-file cache" = "검증: 없는 파일 캐시"
"Check: Keyword cache" = "검증: 키워드 캐시"
"Check: Dated lists while loading" = "검증: 불러오는 동안 날짜 목록"
"Check: Checksum after the databases" = "검증: 데이터베이스 다음에 체크섬"
"Logs the checksum task's times." = "체크섬 작업 시간을 기록합니다."
"Check: Country range check" = "검증: 국가 범위 확인"
"Check: Online service pacing" = "검증: 온라인 서비스 주기 조절"
"Runs the callbacks as the game does and counts what pacing would leave out." = "콜백을 게임처럼 실행하고 주기 조절로 빠질 부분을 셉니다."
"Check: Modifier merge index" = "검증: 수정자 병합 색인"
"Check: Port table" = "검증: 항구 표"
"Check: Province modifier view" = "검증: 프로빈스 수정자 직접 읽기"
"Check: AI army search memo" = "검증: AI 군대 탐색 메모"
"Check: Save compression" = "검증: 세이브 압축"
"Compresses as the game does as well and compares; on several threads, decodes each part again." = "게임 방식으로도 압축해 비교합니다. 여러 스레드에서는 각 부분을 다시 풀어 봅니다."
"Check: Skip transfer compression" = "검증: 전송 압축 건너뛰기"
"Keeps the game's copy and checks that nothing reads it." = "게임의 사본을 유지하고 아무것도 그것을 읽지 않는지 확인합니다."
