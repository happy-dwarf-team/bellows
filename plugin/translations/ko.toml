# The plugin's texts in Korean: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Faster Europa Universalis IV start-up, simulation and saves, with no change to game files or rules." = "Europa Universalis IV의 시작, 시뮬레이션, 저장을 더 빠르게 합니다. 게임 파일이나 규칙은 바꾸지 않습니다."
"mimalloc" = "mimalloc"
"Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)." = "게임의 C 런타임을 위한 더 빠른 메모리 할당자입니다. 게임 세션 전체에 쓰거나 메인 메뉴까지만 씁니다(그 뒤의 할당은 Windows 힙을 씁니다)."
"Start-up" = "시작"
"On" = "켜기"
"Start-up only" = "시작할 때만"
"Off" = "끄기"
"PhysFS path checks" = "PhysFS 경로 확인"
"Answers PhysFS path checks from directory listings." = "PhysFS 경로 확인에 디렉터리 목록으로 답합니다."
"Verify" = "검증"
"File existence index" = "파일 존재 색인"
"Answers \"does this file exist\" for the modifier icon check." = "수정자 아이콘 확인에서 '이 파일이 있는가'에 답합니다."
"Trigger profile lookup" = "트리거 프로필 조회"
"Faster lookup of each trigger in the game's trigger profile at the end of loading." = "불러오기가 끝날 때 게임의 트리거 프로필에서 각 트리거를 더 빠르게 찾습니다."
"Parameter substitution" = "매개변수 치환"
"Single-pass $parameter$ substitution in scripted effects and triggers." = "스크립트 효과와 트리거의 $parameter$ 치환을 한 번에 처리합니다."
"Conditional blocks" = "조건 블록"
"Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)." = "스크립트 효과와 트리거의 [[parameter] ...] 블록을 한 번에 처리합니다(Anbennar처럼 큰 스크립트 효과가 있는 모드에서 효과가 큽니다)."
"Open warm-up" = "파일 미리 열기"
"Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)." = "게임이 필요로 할 파일을 병렬 스레드에서 미리 엽니다(컴퓨터를 다시 시작한 뒤 첫 실행용)."
"RAM prefetch" = "RAM 미리 읽기"
"Reads and unpacks the DLC archive members the game will need into RAM on worker threads." = "게임이 필요로 할 DLC 압축 파일의 항목을 작업 스레드에서 RAM으로 읽고 풉니다."
"RAM prefetch budget (MB)" = "RAM 미리 읽기 한도(MB)"
"RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment." = "풀었지만 게임이 아직 가져가지 않은 압축 파일 항목에 쓰는 RAM입니다. 한 번의 시작에는 그 순간 남은 메모리의 4분의 1까지만 씁니다."
"Missing-file cache" = "없는 파일 캐시"
"Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)." = "시작하는 동안 게임과 모드 파일의 '파일 없음' 응답을 기억합니다(다른 모듈 외에 최대 약 0.1초)."
"Tokenizer keyword cache" = "토크나이저 키워드 캐시"
"Caches the script tokenizer's keyword lookups." = "스크립트 토크나이저의 키워드 조회를 캐시합니다."
"PhysFS path checks after start-up" = "시작 후 PhysFS 경로 확인"
"Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old." = "불러오기: 메인 메뉴가 뜬 뒤에도 PhysFS 경로 확인에 디렉터리 목록으로 계속 답합니다(verifypath_listing이 켜져 있을 때 사용). 그래서 세이브를 불러올 때 텍스처를 약 1.8초 빨리 찾습니다. 목록은 30초가 지나면 다시 읽습니다."
"Loading" = "불러오기"
"Dated lists while loading" = "불러오는 동안 날짜 목록"
"Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares." = "불러오기: 게임이 방금 읽은 항목을 날짜 목록에 추가할 때, 그 새 항목이 이미 있는지 보려고 먼저 목록 전체를 훑지 않습니다. 결과 목록은 같습니다. 검증은 게임이 훑게 하고 비교합니다."
"PhysFS lookups from listings" = "목록으로 PhysFS 조회"
"Start-up: answers the file system's second look at a folder (does the file exist, open a file that is not there) from the directory listings of PhysFS path checks (used while verifypath_listing is on). Existing files are still opened by the game. Saves the failed opens a big mod set such as Anbennar makes in every folder it overrides. Verify asks the game every time and counts differences." = "시작: 파일 시스템이 폴더를 두 번째로 확인할 때(파일이 있는지, 없는 파일 열기) PhysFS 경로 확인의 디렉터리 목록(verifypath_listing이 켜져 있을 때 사용)으로 답합니다. 있는 파일은 계속 게임이 엽니다. Anbennar 같은 큰 모드 구성이 덮어쓰는 모든 폴더에서 실패하는 열기를 줄입니다. 검증은 매번 게임에 묻고 차이를 셉니다."
"Checksum after the databases" = "데이터베이스 다음에 체크섬"
"Loading: the game's checksum task starts reading files only once the databases are loaded, so it no longer competes with them for the file system lock. Same files, order and checksum shown in the menu; about 1 s off the start of a big mod set such as Anbennar, nothing measurable on the base game. Verify only logs the task's times." = "불러오기: 게임의 체크섬 작업이 데이터베이스를 다 불러온 뒤에야 파일을 읽기 시작하므로, 더 이상 파일 시스템 잠금을 두고 데이터베이스와 다투지 않습니다. 파일, 순서, 메뉴에 표시되는 체크섬은 같습니다. Anbennar 같은 큰 모드 구성에서는 시작이 약 1초 빨라지고, 기본 게임에서는 측정할 만한 차이가 없습니다. 검증은 작업 시간만 기록합니다."
"Country range check" = "국가 범위 확인"
"Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code." = "시작이 아닌 시뮬레이션: 국가 범위 확인에 지난번 범위 안에 있던 프로빈스부터 답합니다. 답은 게임 코드와 같습니다."
"Simulation" = "시뮬레이션"
"Modifier merge index" = "수정자 병합 색인"
"Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares." = "시뮬레이션: 큰 수정자 목록(월간 갱신에서 각 국가의 수정자를 모든 부대의 수정자에 더하는 것)을 항목마다 훑는 대신 색인으로 더합니다. 그래서 속도 5에서 1년이 약 5% 빨리 지나갑니다. 항목, 순서, 값은 같습니다. 검증은 게임의 병합을 실행하고 비교합니다."
"Online service pacing" = "온라인 서비스 주기 조절"
"Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out." = "시뮬레이션: 가장 빠른 속도에서 게임의 Paradox 온라인 서비스 콜백을 프레임마다 두 번 대신 500ms마다 실행합니다. 전달할 것이 없으면 실행할 때마다 메인 스레드를 1ms 재웁니다. 멀티플레이는 게임의 주기를 유지합니다. 검증은 게임처럼 실행하고 빠질 부분을 셉니다."
"Province modifier view" = "프로빈스 수정자 직접 읽기"
"Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares." = "시뮬레이션: 일일 국가 갱신과 AI에서 프로빈스 수정자의 값 하나를 읽을 때 목록 전체를 먼저 복사하지 않고 그 자리에서 읽습니다. 값은 같습니다. 검증은 게임의 복사를 실행하고 비교합니다."
"Port table" = "항구 표"
"Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares." = "시뮬레이션: 국가의 가장 가까운 항구 표를, 지도의 모든 프로빈스마다 그 나라의 프로빈스와 관계를 다시 훑는 대신 그 나라 항구 목록 하나로 다시 만듭니다. 표는 같습니다. 검증은 게임의 함수를 실행하고 비교합니다."
"AI army search memo" = "AI 군대 탐색 메모"
"Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares." = "시뮬레이션: AI가 매일 각 군대를 위해 하는 탐색, 경로 탐색, 프로빈스에서 부대의 이동을 나열할 때, 그 군대가 요새의 통제 구역을 무시하는지와 속도 수정치를 이동마다가 아니라 한 번만 계산합니다. 답은 같습니다. 검증은 매번 게임의 확인을 실행하고 비교합니다."
"Frame pacing at speed 5" = "속도 5에서 프레임 조절"
"Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5." = "시뮬레이션: 가장 빠른 속도에서 아무것도 하지 않는 동안 일일 틱 안에서 프레임을 덜 자주 그립니다(간격 참고). 그래서 1년이 약 10% 빨리 지나갑니다. 키를 누르거나 클릭하면 여전히 바로 프레임을 그립니다. 시뮬레이션은 같고, 속도 5에서 지도가 초당 약 22번 대신 16번 갱신됩니다."
"Frame pacing interval (ms)" = "프레임 조절 간격(ms)"
"Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames. Applies at once while frame pacing is on." = "가장 빠른 속도에서 일일 틱 안에서 그리는 프레임 사이의 최소 시간입니다(게임 자체는 50ms이며, 더 짧은 값은 게임의 간격을 유지합니다). 0은 게임의 간격을 유지하고 프레임만 셉니다. 프레임 조절이 켜져 있으면 바로 적용됩니다."
"Frame pacing while you play" = "플레이하는 동안 프레임 조절"
"What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0). Applies at once while frame pacing is on." = "속도 5에서 키를 누르거나 클릭하거나 휠을 돌릴 때 프레임 조절이 하는 일입니다. 바로 프레임을 그려 프레임 조절이 없을 때만큼 빠르게 반응하거나(프레임은 아무것도 하지 않는 동안에만 건너뜀), 더 긴 간격을 기다립니다(0.12.0). 프레임 조절이 켜져 있으면 바로 적용됩니다."
"React at once" = "바로 반응"
"Wait for the interval" = "간격까지 기다리기"
"Full speed while minimized" = "최소화 중에도 최고 속도"
"Simulation: while a single-player game runs at speed 5, the game skips its own waits of up to 100 ms a frame, which it makes while the window is minimized. A minimized year then takes about 40-60% less time; with the window visible nothing changes. Uses more processor time per second while minimized at speed 5. Pauses, menus, other speeds and multiplayer keep the game's waits." = "시뮬레이션: 싱글플레이 게임이 속도 5로 진행되는 동안, 창이 최소화되었을 때 게임이 프레임마다 넣는 최대 100ms의 대기를 건너뜁니다. 그러면 최소화된 상태의 1년이 약 40~60% 짧아지고, 창이 보이면 아무것도 바뀌지 않습니다. 속도 5에서 최소화된 동안 초당 프로세서 시간을 더 씁니다. 일시 정지, 메뉴, 다른 속도, 멀티플레이는 게임의 대기를 유지합니다."
"Save compression" = "세이브 압축"
"Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two." = "저장: 압축 세이브(compress_autosave 등)에서 게임의 바이트 단위 CRC-32를 쓰지 않습니다. 파일은 게임의 것과 바이트 단위로 같습니다. 검증은 게임 자체 압축도 실행해 그 결과를 쓰고 둘을 비교합니다."
"Saving" = "저장"
"Parallel save compression" = "세이브 병렬 압축"
"Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it." = "저장(세이브 압축이 켜져 있을 때): 압축 세이브의 큰 항목(gamestate)을 여러 스레드에서 압축합니다. 세이브는 게임과 다른 도구가 전처럼 읽는 올바른 압축 파일이지만, 압축된 바이트는 게임의 것과 다릅니다. 검증은 쓰기 전에 각 항목을 다시 풀어 봅니다."
"Skip transfer compression" = "전송 압축 건너뛰기"
"Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it." = "싱글플레이에서 불러오기: 아무도 받지 않는 멀티플레이 전송을 위해 텍스트 세이브를 압축하지 않습니다. 게임은 전과 같은 파일을 불러옵니다. 호스트하는 멀티플레이는 그대로 둡니다. 검증은 게임의 사본을 유지하고 아무것도 그것을 읽지 않는지 확인합니다."
"Daily tick profile" = "일일 틱 프로필"
"Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv." = "진단: 일일, 월간, 연간 틱의 각 단계와 그 안에서 그린 프레임의 시간을 게임 날짜마다 tick_profile*.tsv에 기록합니다."
"Diagnostics" = "진단"
"AI army search profile" = "AI 군대 탐색 프로필"
"Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv." = "진단: AI 군대 탐색의 호출, 시간, 반복된 답을 army_search*.tsv에 기록합니다."
"AI scoring probe" = "AI 점수 계산 측정"
"Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv." = "진단: AI 군대 탐색의 점수 함수 입력이 게임 하루 안에 얼마나 자주 반복되는지 score_probe.tsv에 기록합니다."
"Monthly tick probe" = "월간 틱 측정"
"Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv." = "진단: 월간 틱의 국가, 프로빈스, 부대 갱신과 수정자 병합, 난수 추첨의 시간을 monthly_probe*.tsv에 기록합니다."
"ZIP read profile" = "ZIP 읽기 프로필"
"Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log." = "진단: 스레드마다 ZIP 읽기와 압축 풀기(inflate)에 쓴 시간을 anvil.log에 기록합니다."
"Tokenizer lookup profile" = "토크나이저 조회 프로필"
"Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts." = "진단: 토크나이저의 키워드 조회입니다. 호출 지점을 토크나이저 키워드 캐시와 공유하므로, 정확한 횟수를 보려면 캐시를 끄세요."
"Range check profile" = "범위 확인 프로필"
"Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk." = "진단: 국가 범위 확인의 카운터를 range_profile*.tsv에 기록합니다. 게임 자체의 탐색을 보려면 국가 범위 확인을 끄세요."
