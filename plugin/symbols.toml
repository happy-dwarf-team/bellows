# Every game address Bellows uses, declared once (Anvil design §5.2). Anvil
# verifies each symbol against eu4.exe before loading bellows.dll and skips the
# plugin on any other build or on any mismatch; `anvil gen` turns this file into
# symbols.gen.hpp (sym::<name>). The bytes, targets and offsets were validated
# in the lab (Ghidra + byte checks) on the Steam build; the symbols that only
# carry `values` prove a global or a struct offset the modules use. The GOG
# build 1.37.5.2 has the same code at other addresses: each symbol was matched
# to the same instructions there, and only rva, the digest and points_to differ
# (in `build."<id>"`). The GOG build 1.37.5.0 has every symbol at the GOG
# 1.37.5.2 address (anvil port, anvil#187). Addresses in notes are the Steam
# build's.
# Each code symbol states the SHA-256 and the size of its bytes, not the bytes
# (Anvil ADR 0003): while you work, write `bytes` and run Anvil's
# tools/symbols-to-digest.py before the commit. After a change run
# `anvil check plugin --exe <eu4.exe>` with each build's eu4.exe and commit
# symbols.lock.
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64", "eu4-1.37.5.0-gog-win64"]

