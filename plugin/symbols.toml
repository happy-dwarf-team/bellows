# Every game address Bellows uses, declared once (Anvil design §5.2). Anvil
# verifies each symbol against eu4.exe before loading bellows.dll and skips the
# plugin on any other build or on any mismatch; `anvil gen` turns this file into
# symbols.gen.hpp (sym::<name>). The bytes, targets and offsets were validated
# in the lab (Ghidra + byte checks) on the Steam build below; the symbols that
# only carry `values` prove a global or a struct offset the modules use.
# After a change run `anvil check plugin --exe <eu4.exe>` and commit symbols.lock.
build = "eu4-1.37.5-steam-win64"

# --- PhysFS, exported by eu4.exe (verifypath_listing, exists_index) -----------

[symbol.physfs_set_error_code]
export = "PHYSFS_setErrorCode"
signature = "void (int code)"

[symbol.physfs_get_last_error_code]
export = "PHYSFS_getLastErrorCode"
signature = "int ()"

[symbol.physfs_get_write_dir]
export = "PHYSFS_getWriteDir"
signature = "const char* ()"

[symbol.physfs_get_search_path]
export = "PHYSFS_getSearchPath"
signature = "char** ()"

[symbol.physfs_free_list]
export = "PHYSFS_freeList"
signature = "void (void* list)"

[symbol.physfs_get_mount_point]
export = "PHYSFS_getMountPoint"
signature = "const char* (const char* dir)"

[symbol.physfs_symbolic_links_permitted]
export = "PHYSFS_symbolicLinksPermitted"
signature = "int ()"

