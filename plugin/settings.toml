# What the player can change (Anvil design §5.3, §11). Anvil keeps the values
# that differ from these defaults in anvil/data/bellows/settings.toml, and the
# environment variables ANVIL_BELLOWS_<NAME> override them for one start.
# Every module is installed while the game starts, so every setting applies at
# the next start (restart = true). "verify" also runs the game's own code and
# keeps its result: slower, for checking correctness.
# From 1.0 the names and values of these settings keep their meaning in every
# 1.x release (README, "Compatibility"), except the group "Diagnostics": lab
# tools whose names, counters and output files may change in a minor release.

[setting.mimalloc]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "startup", label = "Start-up only" }, { name = "off", label = "Off" }]
default = "startup"
label = "mimalloc"
description = "Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)."
group = "Start-up"
restart = true

[setting.verifypath_listing]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "PhysFS path checks"
description = "Answers PhysFS path checks from directory listings."
group = "Start-up"
restart = true

[setting.verifypath_session]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "on"
label = "PhysFS path checks after start-up"
description = "Loading: keeps answering PhysFS path checks from directory listings after the main menu is up (used while verifypath_listing is on), so loading a save finds its textures about 1.8 s sooner. A listing is read again once it is 30 s old."
group = "Loading"
restart = true

[setting.exists_index]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "File existence index"
description = "Answers \"does this file exist\" for the modifier icon check."
group = "Start-up"
restart = true

[setting.trigger_intern]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Trigger interning"
description = "Faster trigger interning at the end of loading."
group = "Start-up"
restart = true

[setting.metascript_subst]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Parameter substitution"
description = "Single-pass $parameter$ substitution in scripted effects and triggers."
group = "Start-up"
restart = true

[setting.metascript_blocks]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Conditional blocks"
description = "Single-pass resolution of [[parameter] ...] blocks in scripted effects and triggers (big gain on mods with large scripted effects, e.g. Anbennar)."
group = "Start-up"
restart = true

[setting.open_warmup]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }]
default = "on"
label = "Open warm-up"
description = "Opens the files the game will need ahead of it on parallel threads (meant for the first start after a reboot)."
group = "Start-up"
restart = true

[setting.ram_prefetch]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "RAM prefetch"
description = "Reads and unpacks the DLC archive members the game will need into RAM on worker threads."
group = "Start-up"
restart = true

[setting.ram_prefetch_budget_mb]
type = "int"
default = 1024
min = 64
max = 8192
step = 64
label = "RAM prefetch budget (MB)"
description = "RAM for unpacked archive members the game has not taken yet. A start uses at most a quarter of the memory free at that moment."
group = "Start-up"
restart = true

[setting.attr_cache]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "off"
label = "Missing-file cache"
description = "Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)."
group = "Start-up"
restart = true

[setting.token_dict_cache]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Tokenizer keyword cache"
description = "Caches the script tokenizer's keyword lookups."
group = "Start-up"
restart = true

[setting.range_witness]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Country range check"
description = "Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code."
group = "Simulation"
restart = true

[setting.tick_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Daily tick profile"
description = "Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv."
group = "Diagnostics"
restart = true

[setting.army_search_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "AI army search profile"
description = "Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv."
group = "Diagnostics"
restart = true

[setting.score_probe]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "AI scoring probe"
description = "Diagnostic: how often the inputs of the AI army search's scoring functions repeat within a game day, in score_probe.tsv."
group = "Diagnostics"
restart = true

[setting.monthly_probe]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Monthly tick probe"
description = "Diagnostic: time of the monthly tick's country, province and unit updates, modifier merges and random draws, in monthly_probe*.tsv."
group = "Diagnostics"
restart = true

[setting.modifier_merge]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Modifier merge index"
description = "Simulation: adds large modifier lists (each country's modifiers to every unit's in the monthly update) with an index instead of a scan per entry, so a year at speed 5 passes about 5% sooner; the same entries, order and values. Verify runs the game's merge and compares."
group = "Simulation"
restart = true

[setting.pops_pacing]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Online service pacing"
description = "Simulation: at the fastest speed, runs the game's Paradox online-service callbacks every 500 ms instead of twice a frame. With nothing to deliver, each run makes the main thread sleep 1 ms. Multiplayer keeps the game's rate. Verify runs them as the game does and counts what would be left out."
group = "Simulation"
restart = true

[setting.province_modifier_view]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Province modifier view"
description = "Simulation: reads one value from a province's modifiers in place instead of copying the whole list first (in the daily country update and the AI); the same value. Verify runs the game's copy and compares."
group = "Simulation"
restart = true

[setting.port_table]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Port table"
description = "Simulation: rebuilds a country's table of the nearest port from one list of its ports instead of walking its provinces and relations again for every province of the map; the same table. Verify runs the game's function and compares."
group = "Simulation"
restart = true

[setting.army_search_memo]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "AI army search memo"
description = "Simulation: in the AI's daily search for each army, in a path search and when a unit's moves from a province are listed, works out once whether the army ignores forts' zones of control and what its speed modifier is, instead of for every move; the same answers. Verify runs the game's check every time and compares."
group = "Simulation"
restart = true

[setting.army_strength_memo]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "off"
label = "AI army strength memo"
description = "Simulation: in the AI's daily search for each army, works out the army's strength against a province once instead of once for each neighbouring province."
group = "Simulation"
restart = true

[setting.save_compress]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Save compression"
description = "Saving: compressed saves (compress_autosave and the like) without the game's byte-at-a-time CRC-32; the file is byte for byte the game's. Verify runs the game's own compression as well, writes its result and compares the two."
group = "Saving"
restart = true

[setting.save_compress_parallel]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "off"
label = "Parallel save compression"
description = "Saving, with save compression on: compresses large members of a compressed save (the gamestate) on several threads. The save is a valid archive that the game and other tools read as before, but its compressed bytes differ from the game's. Verify decodes each member again before writing it."
group = "Saving"
restart = true

[setting.history_add]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Dated lists while loading"
description = "Loading: adds an entry the game just read to a dated list without first walking the whole list to see whether that new entry is in it. The list comes out the same. Verify lets the game walk and compares."
group = "Loading"
restart = true

[setting.transfer_skip]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Skip transfer compression"
description = "Loading in single player: does not compress a text save for a multiplayer transfer that nobody receives; the game loads the same file as before. Hosted multiplayer is left as it is. Verify keeps the game's copy and checks that nothing reads it."
group = "Saving"
restart = true

[setting.frame_pacing]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "on"
label = "Frame pacing at speed 5"
description = "Simulation: at the fastest speed, draws frames from inside the daily tick less often while you do nothing (see the interval), so a year passes about 10% sooner; a key press or click still gets a frame at once. The simulation is the same; the map updates about 16 instead of 22 times a second at speed 5."
group = "Simulation"
restart = true

[setting.frame_pacing_interval_ms]
type = "int"
default = 100
min = 0
max = 1000
step = 10
label = "Frame pacing interval (ms)"
description = "Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames."
group = "Simulation"
restart = true

[setting.frame_pacing_input]
type = "enum"
values = [{ name = "draw", label = "React at once" }, { name = "wait", label = "Wait for the interval" }]
default = "draw"
label = "Frame pacing while you play"
description = "What frame pacing does when you press a key, click or turn the wheel at speed 5: draw a frame at once, so the game reacts at least as fast as without frame pacing (frames are skipped only while you do nothing), or wait for the longer interval (0.12.0)."
group = "Simulation"
restart = true

[setting.zip_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "ZIP read profile"
description = "Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log."
group = "Diagnostics"
restart = true

[setting.token_dict_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Tokenizer lookup profile"
description = "Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts."
group = "Diagnostics"
restart = true

[setting.range_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Range check profile"
description = "Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk."
group = "Diagnostics"
restart = true
