# What the player can change (Anvil design §5.3, §11). Anvil keeps the values
# that differ from these defaults in anvil/data/bellows/settings.toml, and the
# environment variables ANVIL_BELLOWS_<NAME> override them for one start.
# Every module is installed while the game starts, so every setting applies at
# the next start (restart = true). "verify" also runs the game's own code and
# keeps its result: slower, for checking correctness.

[setting.mimalloc]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "startup", label = "Start-up only" }, { name = "off", label = "Off" }]
default = "startup"
label = "mimalloc"
description = "Faster memory allocator for the game's C runtime: for the whole game session, or only until the main menu (later allocations use the Windows heap)."
group = "Start-up"
restart = true

[setting.verifypath_listing]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "PhysFS path checks"
description = "Answers PhysFS path checks from directory listings."
group = "Start-up"
restart = true

[setting.exists_index]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "File existence index"
description = "Answers \"does this file exist\" for the modifier icon check."
group = "Start-up"
restart = true

[setting.trigger_intern]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Trigger interning"
description = "Faster trigger interning at the end of loading."
group = "Start-up"
restart = true

[setting.metascript_subst]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Parameter substitution"
description = "Single-pass $parameter$ substitution in scripted effects and triggers."
group = "Start-up"
restart = true

[setting.open_warmup]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }]
default = "on"
label = "Open warm-up"
description = "Opens the files the game will need ahead of it on parallel threads (big gain on the first start after a reboot)."
group = "Start-up"
restart = true

[setting.ram_prefetch]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "RAM prefetch"
description = "Reads and unpacks the DLC archive members the game will need into RAM on worker threads."
group = "Start-up"
restart = true

[setting.ram_prefetch_budget_mb]
type = "int"
default = 1024
min = 64
max = 8192
step = 64
label = "RAM prefetch budget (MB)"
description = "RAM for unpacked archive members the game has not taken yet."
group = "Start-up"
restart = true

[setting.attr_cache]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "off"
label = "Missing-file cache"
description = "Remembers \"file not found\" answers for game and mod files during start-up (at most ~0.1 s next to the other modules)."
group = "Start-up"
restart = true

[setting.token_dict_cache]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Tokenizer keyword cache"
description = "Caches the script tokenizer's keyword lookups."
group = "Start-up"
restart = true

[setting.range_witness]
type = "enum"
values = [{ name = "on", label = "On" }, { name = "off", label = "Off" }, { name = "verify", label = "Verify" }]
default = "on"
label = "Country range check"
description = "Simulation, not start-up: answers the country range check from the province that was in range last time; same answers as the game's code."
group = "Simulation"
restart = true

[setting.tick_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Daily tick profile"
description = "Diagnostic: time of each stage of the daily, monthly and yearly tick and of the frames drawn inside it, per game day, in tick_profile*.tsv."
group = "Diagnostics"
restart = true

[setting.army_search_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "AI army search profile"
description = "Diagnostic: calls, time and repeated answers of the AI army search, in army_search*.tsv."
group = "Diagnostics"
restart = true

[setting.frame_pacing]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Frame pacing at speed 5"
description = "Simulation, experimental: at the fastest speed, draws frames from inside the daily tick less often (see the interval). The simulation is the same; the map and interface update less smoothly and react later to clicks."
group = "Simulation"
restart = true

[setting.frame_pacing_interval_ms]
type = "int"
default = 100
min = 0
max = 1000
step = 10
label = "Frame pacing interval (ms)"
description = "Shortest time between frames drawn inside the daily tick at the fastest speed (the game's own is 50 ms; a shorter value keeps the game's). 0 keeps the game's interval and only counts frames."
group = "Simulation"
restart = true

[setting.zip_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "ZIP read profile"
description = "Diagnostic: time spent in ZIP reads and inflate per thread, in anvil.log."
group = "Diagnostics"
restart = true

[setting.token_dict_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Tokenizer lookup profile"
description = "Diagnostic: the tokenizer's keyword lookups. Shares its call site with the tokenizer keyword cache; turn that off for clean counts."
group = "Diagnostics"
restart = true

[setting.range_profile]
type = "enum"
values = [{ name = "off", label = "Off" }, { name = "on", label = "On" }]
default = "off"
label = "Range check profile"
description = "Diagnostic: counters of the country range check in range_profile*.tsv. Turn the country range check off for the game's own walk."
group = "Diagnostics"
restart = true
