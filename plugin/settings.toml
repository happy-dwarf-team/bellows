# The mode settings of 1.x, which the modules' switches replace (Anvil ADR 0013, point 4). At the
# first start of 2.0, Anvil turns the module off for a player whose file says "off" (and on for one
# of a module off by default that the file turned on), and removes the value from the file.

[retired.mimalloc]
module = "mimalloc"
off = ["off"]

[retired.open_warmup]
module = "open_warmup"
off = ["off"]

[retired.ram_prefetch]
module = "ram_prefetch"
off = ["off"]

[retired.verifypath_listing]
