# What the player can change (Anvil design §5.3, §11). Anvil keeps the values
# that differ from these defaults in anvil/data/bellows/settings.toml, and the
# environment variables ANVIL_BELLOWS_<NAME> override them for one start.
# Each feature is a module of plugin.toml's [[modules]], and its switch there is the only one
# (Anvil ADR 0013): a setting here only refines its module (`module`). Every module is installed
# while the game starts, so a setting applies at the next start (restart = true), except
# frame_pacing_interval_ms and frame_pacing_input, which change while the game runs.
# The names and values of these settings keep their meaning in every 2.x release (README,
# "Compatibility"), except those of the Diagnostics module: lab tools whose names, counters and
# output files may change in a minor release.

[setting.mimalloc_scope]
type = "enum"
values = [{ name = "menu", label = "Until the main menu" }, { name = "session", label = "Whole session" }]
default = "menu"
label = "Used for"
description = "Until the main menu, later allocations use the Windows heap again; or for the whole session."
module = "mimalloc"
restart = true

[setting.ram_prefetch_budget_mb]
type = "int"
default = 1024
min = 64
max = 8192
step = 64
label = "Memory budget (MB)"
description = "RAM for unpacked files the game has not taken yet; a start uses at most a quarter of free memory."
module = "ram_prefetch"
restart = true

[setting.frame_pacing_interval_ms]
type = "int"
default = 100
min = 0
max = 1000
step = 10
label = "Interval (ms)"
description = "Shortest time between frames at speed 5 while you do nothing (the game's is 50 ms); 0 keeps the game's."
module = "frame_pacing"
restart = false

[setting.frame_pacing_input]
type = "enum"
values = [{ name = "draw", label = "React at once" }, { name = "wait", label = "Wait for the interval" }]
default = "draw"
label = "When you press a key or click"
description = "React at once draws a frame for every input; waiting skips more frames."
module = "frame_pacing"
restart = false

[setting.save_compress_parallel]
type = "bool"
default = false
label = "Compress on several threads"
description = "Faster for large saves; the file is a valid save, but its bytes differ from the game's."
module = "save_compress"
restart = true

